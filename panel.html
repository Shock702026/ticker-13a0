<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Panel 13a0</title>
<link rel="icon" href="icono-panel.png"><link rel="apple-touch-icon" href="icono-panel.png"><meta name="apple-mobile-web-app-title" content="Panel 13a0"><meta name="theme-color" content="#180B5B">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=Bitter:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* Panel de control 13a0. Se abre desde Google Apps Script (que guarda en la planilla);
     abierto suelto (sin Apps Script) muestra los datos en modo lectura, para probar. */
  :root { --azul:#180B5B; --celeste:#0086C3; --amarillo:#F9BE02; --rojo:#C5021E; --gris:#6E6A86; --fondo:#F3F2F7; --linea:#E3E1EC; --verde:#1a8a46;
          --f:"Archivo","Helvetica Neue",Arial,sans-serif; --slab:"Bitter",Georgia,serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { height:100%; }   /* el body crece con el contenido: así el espacio para la barra de abajo cuenta */
  body { font:15px/1.4 var(--f); color:var(--azul); background:var(--fondo); display:grid; grid-template-columns:240px 1fr; min-height:100vh; }
  button { font:inherit; cursor:pointer; }
  /* barra lateral */
  .lado { background:var(--azul); color:#fff; display:flex; flex-direction:column; padding:22px 14px; gap:4px; position:sticky; top:0; height:100vh; }
  .marca { display:flex; align-items:center; gap:10px; margin:0 6px 22px; }
  .marca b { background:#fff; color:var(--azul); font:900 26px/1 var(--f); padding:8px 10px; letter-spacing:-.02em; } .marca b i { font-style:normal; color:var(--celeste); }
  .marca span { font:800 15px/1.1 var(--slab); letter-spacing:.08em; text-transform:uppercase; }
  .nav button { width:100%; display:flex; align-items:center; gap:12px; padding:11px 12px; color:#d8d5ea; background:none; border:0; font-weight:700; font-size:16px; text-align:left; }
  .nav button i { width:12px; height:12px; flex:none; } .nav button.on { background:rgba(255,255,255,.12); color:#fff; } .nav button.on i { outline:3px solid #fff; outline-offset:2px; }
  .nav small { margin-left:auto; background:var(--rojo); color:#fff; font:800 12px/1 var(--f); padding:4px 7px; }
  .usuario { margin-top:auto; padding:12px; border-top:1px solid rgba(255,255,255,.15); font-size:12px; color:#d8d5ea; word-break:break-all; }
  .usuario a { color:#fff; display:block; margin-top:8px; font-weight:700; }
  /* contenido */
  .main { padding:24px 28px 40px; display:flex; flex-direction:column; gap:18px; min-width:0; }
  .cab { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .cab h1 { font:800 30px/1 var(--slab); }
  .estado { margin-left:auto; display:flex; align-items:center; gap:8px; font-weight:700; color:var(--verde); font-size:14px; }
  .estado i { width:10px; height:10px; background:currentColor; } .estado.lectura { color:var(--rojo); }
  .btn { font:800 15px/1 var(--f); border:0; padding:13px 20px; background:var(--azul); color:#fff; white-space:nowrap; }
  .btn.am { background:var(--amarillo); color:var(--azul); } .btn.sec { background:#fff; color:var(--azul); outline:2px solid var(--linea); outline-offset:-2px; }
  .btn.ro { background:var(--rojo); } .btn.ce { background:var(--celeste); } .btn.chico { padding:9px 12px; font-size:13px; }
  .btn:disabled { opacity:.45; cursor:default; }
  .card { background:#fff; outline:1px solid var(--linea); }
  .cuerpo { display:grid; grid-template-columns:minmax(380px,460px) 1fr; gap:20px; align-items:start; }
  .form { padding:20px 22px; display:flex; flex-direction:column; gap:14px; }
  .form h2 { font:800 19px/1.1 var(--slab); display:flex; align-items:center; gap:10px; }
  .form h2 i { width:14px; height:14px; flex:none; }
  .grupo { display:flex; flex-direction:column; gap:10px; padding-top:14px; border-top:2px solid var(--linea); }
  .grupo > b { font:800 12px/1 var(--f); letter-spacing:.12em; text-transform:uppercase; color:var(--gris); }
  label, .lbl { display:flex; flex-direction:column; gap:5px; font-weight:700; font-size:13px; }
  .lbl .ayuda, label .ayuda { font-weight:600; color:var(--gris); font-size:12px; }
  input[type=text], input[type=number], select, textarea { font:600 16px/1.2 var(--f); color:var(--azul); border:2px solid var(--linea); padding:10px 12px; background:#fff; width:100%; }
  input:focus, select:focus, textarea:focus, .rico:focus-within { outline:none; border-color:var(--celeste); box-shadow:0 0 0 3px rgba(0,134,195,.18); }
  .dos { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .sw { display:flex; align-items:center; justify-content:space-between; gap:12px; font-weight:700; font-size:14px; padding:10px 12px; background:var(--fondo); cursor:pointer; user-select:none; }
  .sw .t { width:54px; height:30px; background:#cfccdc; position:relative; flex:none; transition:background .15s; } .sw .t::after { content:""; position:absolute; left:4px; top:4px; width:22px; height:22px; background:#fff; transition:left .15s; }
  .sw.on .t { background:#1a9a4a; } .sw.on .t::after { left:28px; }
  .sw small { display:block; font-weight:600; color:var(--gris); font-size:12px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; } .chip { padding:8px 12px; font-weight:800; font-size:13px; background:var(--fondo); border:0; outline:2px solid var(--linea); outline-offset:-2px; color:var(--azul); }
  .chip.on { background:var(--azul); color:#fff; outline-color:var(--azul); }
  .chip.c-rojo.on { background:var(--rojo); outline-color:var(--rojo); } .chip.c-celeste.on { background:var(--celeste); outline-color:var(--celeste); }
  .vista { padding:18px; display:flex; flex-direction:column; gap:12px; min-width:0; position:sticky; top:16px; }
  .vista .tit { display:flex; align-items:center; gap:10px; font-weight:800; font-size:14px; flex-wrap:wrap; }
  .vista .tit .et { background:var(--rojo); color:#fff; font:800 12px/1 var(--f); letter-spacing:.1em; padding:6px 8px; }
  .vista .tit .et.az { background:var(--azul); }
  .vista .tit span:last-child { margin-left:auto; color:var(--gris); font-weight:600; }
  .pv { width:100%; aspect-ratio:16/9; position:relative; overflow:hidden; background:repeating-linear-gradient(45deg,#7a7a7a 0 22px,#848484 22px 44px); }
  .pv.negro { background:#000; } .pv.gris { background:#3a3f4a; }
  .pv iframe { position:absolute; left:0; top:0; width:1920px; height:1080px; border:0; transform-origin:0 0; pointer-events:none; }
  .aviso { background:#FFF6CC; padding:10px 14px; font-size:13px; font-weight:600; }
  .pie { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:4px; }
  .vacio { padding:40px; text-align:center; color:var(--gris); font-weight:700; }
  /* aviso de guardado */
  #toast { position:fixed; right:24px; bottom:24px; background:var(--azul); color:#fff; font-weight:800; padding:14px 20px; transform:translateY(160%); transition:transform .25s; z-index:9; max-width:440px; }
  #toast.on { transform:none; opacity:1; } #toast.error { background:var(--rojo); }
  #toast { opacity:0; pointer-events:none; transition:transform .25s, opacity .25s; }
  #cargando { position:fixed; inset:0; background:var(--fondo); display:flex; align-items:center; justify-content:center; font:800 22px var(--slab); z-index:10; }
  .ingreso { width:min(400px, calc(100vw - 32px)); background:#fff; outline:1px solid var(--linea); padding:26px 24px; display:flex; flex-direction:column; gap:14px; font:600 15px var(--f); }
  .ingreso label { display:flex; flex-direction:column; gap:6px; font-weight:700; font-size:13px; }
  .ingreso input { font:600 18px var(--f); color:var(--azul); border:2px solid var(--linea); padding:12px; }
  .ingreso input:focus { border-color:var(--celeste); outline:none; }
  .ingreso [hidden] { display:none; }
  .ingreso small { font-size:13px; color:var(--gris); min-height:1em; }
  .marca-ing { display:flex; align-items:center; gap:10px; } .marca-ing b { background:var(--azul); color:#fff; font:900 26px/1 var(--f); padding:8px 10px; } .marca-ing b i { font-style:normal; color:var(--celeste); } .marca-ing span { font:800 16px var(--slab); letter-spacing:.08em; text-transform:uppercase; }
  /* texto con palabras en rojo */
  .rico { border:2px solid var(--linea); background:#fff; }
  .barra-r { display:flex; align-items:center; gap:8px; padding:6px; background:var(--fondo); border-bottom:2px solid var(--linea); flex-wrap:wrap; }
  .barra-r button { font:800 13px/1 var(--f); border:0; padding:7px 10px; }
  .rojo-btn { background:var(--rojo); color:#fff; } .quitar-btn { background:#fff; color:var(--azul); outline:2px solid var(--linea); outline-offset:-2px; }
  .barra-r span { color:var(--gris); font-size:12px; font-weight:600; margin-left:auto; }
  .txt-r { padding:10px 12px; font:900 22px/1.25 var(--f); min-height:48px; outline:none; white-space:pre-wrap; }
  .txt-r.p { font:600 15px/1.4 var(--f); min-height:66px; }
  .txt-r em { font-style:normal; color:var(--rojo); }
  .contador { font:700 12px var(--f); color:var(--gris); } .contador.ok { color:var(--verde); } .contador.mal { color:var(--rojo); }
  .lbl-fila { display:flex; justify-content:space-between; align-items:baseline; }
  /* noticias */
  .cuerpo.n { grid-template-columns:380px minmax(420px,1fr) minmax(360px,520px); }
  .lista { padding:12px; display:flex; flex-direction:column; gap:8px; max-height:calc(100vh - 130px); overflow:auto; }
  .filtros { display:flex; gap:6px; margin-bottom:4px; }
  .noti { display:grid; grid-template-columns:64px 1fr auto; gap:10px; align-items:center; padding:8px; background:var(--fondo); cursor:pointer; }
  .noti.on { outline:3px solid var(--amarillo); outline-offset:-3px; background:#fff; }
  .noti .ft { width:64px; height:64px; background:var(--azul) center/cover no-repeat; }
  .noti b { font-weight:900; font-size:15px; line-height:1.2; display:block; } .noti b em { font-style:normal; color:var(--rojo); }
  .noti small { display:block; color:var(--gris); font-weight:600; font-size:12px; margin-top:3px; }
  .noti .acc { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .noti .mov { display:flex; gap:4px; } .noti .mov button { border:0; background:#fff; width:28px; height:24px; font-weight:900; color:var(--azul); outline:1px solid var(--linea); }
  .noti .sw { background:none; padding:0; }
  /* foto */
  .encuadre { display:flex; flex-direction:column; gap:10px; }
  .escena { position:relative; height:330px; background:#222; overflow:hidden; touch-action:none; cursor:grab; }
  .escena img { position:absolute; left:0; top:0; transform-origin:0 0; user-select:none; -webkit-user-drag:none; pointer-events:none; }
  .escena .marco-v { position:absolute; top:0; height:100%; outline:3px solid var(--amarillo); outline-offset:-3px; box-shadow:0 0 0 2000px rgba(10,6,40,.62); pointer-events:none; }
  .escena .mano { position:absolute; right:10px; bottom:10px; background:var(--amarillo); color:var(--azul); font:800 12px/1 var(--f); padding:7px 9px; pointer-events:none; }
  .escena.sin { display:flex; align-items:center; justify-content:center; color:#bbb; font-weight:700; cursor:default; border:3px dashed #555; }
  .escena.arrastrando { outline:4px solid var(--celeste); }
  .zoom { display:flex; align-items:center; gap:10px; font-weight:900; } .zoom input { flex:1; accent-color:var(--celeste); }
  .foto-actual { display:grid; grid-template-columns:110px 1fr; gap:12px; align-items:center; } .foto-actual .ft { width:110px; height:200px; background:#222 center/cover no-repeat; }
  /* cámaras */
  .tiras { display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; }
  .tira { flex:none; width:160px; cursor:pointer; background:none; border:0; text-align:left; color:var(--azul); }
  .tira .mini { width:160px; height:90px; position:relative; overflow:hidden; background:#7a7a7a; outline:3px solid transparent; outline-offset:-3px; }
  .tira.on .mini { outline-color:var(--amarillo); }
  .tira .mini iframe { position:absolute; left:0; top:0; width:1920px; height:1080px; border:0; transform:scale(.08333); transform-origin:0 0; pointer-events:none; }
  .tira span { display:block; font-weight:800; font-size:13px; margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tira span em { font-style:normal; color:var(--gris); font-weight:600; }
  /* partido */
  .botonera { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .botonera .btn { padding:14px 10px; }
  .marcador-m { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; text-align:center; font-weight:900; }
  .marcador-m .g { font-size:40px; } .marcador-m input { text-align:center; }
  /* tablas sueltas */
  table.ed { width:100%; border-collapse:collapse; } table.ed th { font:800 11px/1 var(--f); letter-spacing:.1em; text-transform:uppercase; color:var(--gris); text-align:left; padding:6px; }
  table.ed td { padding:3px; } table.ed input, table.ed select { padding:7px 8px; font-size:14px; }
  table.ed td.esc img { width:34px; height:34px; object-fit:contain; display:block; }
  table.ed td.quitar button { border:0; background:none; color:var(--rojo); font-weight:900; font-size:18px; }
  .inicio { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
  .inicio .card { padding:20px; display:flex; flex-direction:column; gap:10px; cursor:pointer; }
  .inicio .card b { font:800 20px/1.1 var(--slab); } .inicio .card span { color:var(--gris); font-weight:600; }
  .inicio .card i { width:100%; height:6px; }
  @media (max-width:1300px) { .cuerpo.n { grid-template-columns:340px 1fr; } .cuerpo.n > .vista { grid-column:1 / -1; position:static; } }
  /* permisos: solo mirar, pendientes, emergencia, accesos, historial */
  .solo-ver input, .solo-ver textarea, .solo-ver select, .solo-ver .btn, .solo-ver .sw, .solo-ver .barra-r button, .solo-ver .mov, .solo-ver .escena, .solo-ver .encuadre label { pointer-events:none; opacity:.5; }
  .solo-ver .chip, .solo-ver .tira, .solo-ver .filtros .chip { pointer-events:auto; opacity:1; }
  .banda-ver { background:var(--celeste); color:#fff; font-weight:800; padding:10px 14px; }
  .tag-pend { background:var(--amarillo); color:var(--azul); font:800 11px var(--f); padding:3px 6px; margin-left:4px; }
  .btn.ok { background:var(--verde); color:#fff; }
  .emergencia { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .emergencia .btn { background:var(--rojo); color:#fff; }
  .emergencia .btn.seguro { background:#7a0011; animation:latido 1s infinite; }
  @keyframes latido { 50% { box-shadow:0 0 0 6px rgba(197,2,30,.25); } }
  .acc-grid { display:grid; grid-template-columns:1fr minmax(320px,430px); gap:20px; align-items:start; }
  table.acc { width:100%; border-collapse:collapse; } table.acc th { font:800 11px var(--f); letter-spacing:.1em; text-transform:uppercase; color:var(--gris); text-align:left; padding:6px 8px; }
  table.acc td { padding:12px 8px; border-top:2px solid var(--linea); vertical-align:middle; }
  .per { display:flex; align-items:center; gap:10px; } .per i { width:34px; height:34px; flex:none; display:flex; align-items:center; justify-content:center; font:900 15px var(--f); color:#fff; font-style:normal; background:var(--celeste); }
  .per b { display:block; font-weight:800; } .per small { color:var(--gris); font-weight:600; font-size:12px; word-break:break-all; }
  .madre { background:var(--amarillo); color:var(--azul); font:800 11px var(--f); padding:4px 7px; margin-left:4px; }
  .vencido { background:var(--rojo); color:#fff; font:800 11px var(--f); padding:4px 7px; margin-left:4px; }
  .niv { display:flex; flex-wrap:wrap; gap:6px; } .niv button { border:0; font:800 12px var(--f); padding:6px 9px; background:var(--fondo); color:var(--gris); outline:2px solid var(--linea); outline-offset:-2px; }
  .niv button.ver { background:#dff1fa; color:var(--celeste); outline-color:var(--celeste); } .niv button.cargar { background:#FFF6CC; color:#7a5a00; outline-color:var(--amarillo); } .niv button.editar { background:var(--azul); color:#fff; outline-color:var(--azul); }
  .quitar-acc { border:0; background:none; font:800 13px var(--f); color:var(--rojo); }
  .leyenda { display:flex; gap:12px; flex-wrap:wrap; font-size:12px; font-weight:700; color:var(--gris); } .leyenda span { display:flex; align-items:center; gap:6px; } .leyenda i { width:14px; height:14px; }
  .invitacion { background:#e9f7ef; border:2px solid #9fd8b4; padding:12px; display:flex; flex-direction:column; gap:8px; } .invitacion pre { white-space:pre-wrap; font:600 13px/1.4 var(--f); }
  .hist { display:flex; flex-direction:column; } .hist .it { display:grid; grid-template-columns:90px 1fr auto; gap:12px; align-items:center; padding:10px 4px; border-top:2px solid var(--linea); }
  .hist .it small { color:var(--gris); font-weight:700; } .hist .it b { font-weight:800; } .hist .it .sec { font:800 11px var(--f); color:#fff; background:var(--azul); padding:3px 6px; margin-right:6px; }
  .hist .it.deshecho { opacity:.45; } .hist .it.deshecho .que { text-decoration:line-through; }
  @media (max-width:760px) { .acc-grid { grid-template-columns:1fr; } table.acc td { display:block; border:0; padding:6px 4px; } table.acc tr { display:block; border-top:2px solid var(--linea); padding:8px 0; } table.acc th { display:none; } .hist .it { grid-template-columns:1fr auto; } .hist .it small { grid-column:1 / -1; } }
  /* Equipo y convocatorias */
  input[type=date], input[type=time], input[type=email], input[type=tel] { font:600 16px/1.2 var(--f); color:var(--azul); border:2px solid var(--linea); padding:10px 12px; background:#fff; width:100%; }
  .eq-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px; align-items:start; }
  .carnet { display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap; }
  .carnet .foto { width:120px; aspect-ratio:3/4; background:var(--fondo) center/cover no-repeat; outline:2px dashed var(--linea); outline-offset:-2px; display:flex; align-items:center; justify-content:center; color:var(--gris); font-weight:700; font-size:12px; text-align:center; padding:6px; flex:none; }
  .carnet .foto.acred { width:180px; aspect-ratio:3/2; }
  .carnet .foto.ok { outline:0; }
  .carnet a.btn { text-decoration:none; display:inline-block; }
  .subir { position:relative; overflow:hidden; } .subir input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .rol-chip { padding:6px 10px; font:800 12px var(--f); background:var(--fondo); outline:2px solid var(--linea); outline-offset:-2px; border:0; color:var(--azul); }
  .rol-chip.on { background:var(--amarillo); outline-color:var(--amarillo); }
  .ausencia { display:flex; align-items:center; gap:10px; padding:8px 10px; background:var(--fondo); font-weight:700; font-size:14px; } .ausencia button { margin-left:auto; border:0; background:none; color:var(--rojo); font:800 13px var(--f); }
  .ausencia .mot { font:800 11px var(--f); padding:3px 6px; color:#fff; background:var(--celeste); } .ausencia .mot.enfermedad { background:var(--rojo); }
  .persona { display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; padding:14px 4px; border-top:2px solid var(--linea); }
  .persona .datos { font-size:13px; font-weight:600; color:var(--gris); display:flex; flex-wrap:wrap; gap:4px 14px; }
  .persona .ficha { grid-column:1 / -1; }
  .tag { font:800 11px var(--f); padding:3px 6px; background:var(--fondo); color:var(--gris); } .tag.ok { background:#e2f4e9; color:var(--verde); } .tag.mal { background:#fbe3e6; color:var(--rojo); }
  .subtabs { display:flex; gap:8px; flex-wrap:wrap; }
  /* archivo de fotos */
  .grilla-fotos { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
  .foto-a { background:#fff; outline:1px solid var(--linea); outline-offset:-1px; display:flex; flex-direction:column; }
  .foto-a.dejar { outline:3px solid var(--verde); outline-offset:-3px; }
  .foto-a .ft { display:block; aspect-ratio:11/20; max-height:300px; background:#ddd center/cover no-repeat; }
  .foto-a .tx { padding:8px 10px; display:flex; flex-direction:column; gap:3px; min-width:0; } .foto-a .tx b { font-size:14px; line-height:1.25; }
  .foto-a .tx small { font-size:11px; color:var(--gris); } .foto-a .tx em { font-style:normal; color:var(--rojo); font-weight:700; }
  .foto-a .acc { display:flex; gap:6px; padding:0 10px 10px; } .foto-a .acc .btn { flex:1; }
  .rojo-b { background:#fff; color:var(--rojo); outline:2px solid var(--rojo); outline-offset:-2px; }
  @media (max-width:760px) { .grilla-fotos { grid-template-columns:1fr 1fr; gap:8px; } .foto-a .acc { flex-direction:column; } }
  /* titulares de radio: vista e impresión */

    if (/^#{1,3}\s/.test(b)) return `<h3>${linea(b.replace(/^#+\s*/, ""))}</h3>`;
    if (/^\*\*[^*]+\*\*$/.test(b)) return `<h4>${linea(b.slice(2, -2))}</h4>`;
    if (/^\*Dudas/i.test(b)) return `<p class="dudas">${linea(b)}</p>`;

  }).join("");

/* Encuadre de la foto: el recuadro amarillo es lo que sale en la tanda (vertical, 504 × 920) */
function encuadrador(onCambio) {
  const RAZON = 504 / 920, SAL_W = 1008, SAL_H = 1840;
  const el = h(`<div class="encuadre"><div class="escena sin">Arrastrá una foto acá o tocá «Subir foto»</div><div class="zoom" style="display:none"><span>−</span><input type="range" min="1" max="4" step="0.01" value="1"><span>+</span></div><div class="pie"><label class="btn az chico" style="flex-direction:row">📷 Sacar foto<input type="file" accept="image/*" capture="environment" hidden></label><label class="btn sec chico" style="flex-direction:row">🖼 Elegir foto<input type="file" accept="image/*" hidden></label><span class="ayuda" style="color:var(--gris);font-size:12px;font-weight:600">Se guarda sola en Drive al tocar Guardar</span></div></div>`);
  const esc_ = el.querySelector(".escena"), zoom = el.querySelector(".zoom"), rango = zoom.querySelector("input"), files = el.querySelectorAll("input[type=file]");
  let im = null, base = 1, x = 0, y = 0, mw = 0, mx = 0;
  const marco = () => { const H = esc_.clientHeight; mw = H * RAZON; mx = (esc_.clientWidth - mw) / 2; return { H }; };
  function limitar() {
    const { H } = marco(), s = base * +rango.value, w = im.naturalWidth * s, hh = im.naturalHeight * s;
    x = Math.min(mx, Math.max(mx + mw - w, x)); y = Math.min(0, Math.max(H - hh, y));
    im.style.transform = `translate(${x}px,${y}px) scale(${s})`;
  }
  const exportar = debounce(() => {
    const s = base * +rango.value, c = document.createElement("canvas"); c.width = SAL_W; c.height = SAL_H;
    c.getContext("2d").drawImage(im, (mx - x) / s, (0 - y) / s, mw / s, esc_.clientHeight / s, 0, 0, SAL_W, SAL_H);
    onCambio(c.toDataURL("image/jpeg", 0.88));
  }, 200);
  function abrir(f) {
    if (!f || !/^image\//.test(f.type)) return;
    const r = new FileReader();
    r.onload = () => {
      esc_.className = "escena"; esc_.innerHTML = `<img><div class="marco-v"></div><span class="mano">✥ Arrastrá para encuadrar · pellizcá para zoom</span>`;
      im = esc_.querySelector("img"); im.onload = () => {
        const { H } = marco(); esc_.querySelector(".marco-v").style.cssText = `left:${mx}px;width:${mw}px`;
        base = Math.max(mw / im.naturalWidth, H / im.naturalHeight); rango.value = 1;
        x = mx + (mw - im.naturalWidth * base) / 2; y = (H - im.naturalHeight * base) * 0.3;
        zoom.style.display = ""; limitar(); exportar();
      };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  }
  files.forEach((fi) => (fi.onchange = () => abrir(fi.files[0])));
  esc_.addEventListener("dragover", (e) => { e.preventDefault(); esc_.classList.add("arrastrando"); });
  esc_.addEventListener("dragleave", () => esc_.classList.remove("arrastrando"));
  esc_.addEventListener("drop", (e) => { e.preventDefault(); esc_.classList.remove("arrastrando"); abrir(e.dataTransfer.files[0]); });
  // un dedo (o el mouse) mueve la foto; dos dedos la agrandan o achican
  let arr = null; const dedos = new Map(); let pinza = null;
  const dist = () => { const p = [...dedos.values()]; return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); };
  esc_.addEventListener("pointerdown", (e) => {
    if (!im) return; esc_.setPointerCapture(e.pointerId); dedos.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (dedos.size === 2) { arr = null; pinza = { d: dist(), z: +rango.value }; } else { arr = [e.clientX - x, e.clientY - y]; esc_.style.cursor = "grabbing"; }
  });
  esc_.addEventListener("pointermove", (e) => {
    if (!dedos.has(e.pointerId)) return; dedos.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinza && dedos.size === 2) { rango.value = Math.min(4, Math.max(1, pinza.z * dist() / pinza.d)); rango.oninput(); return; }
    if (arr) { x = e.clientX - arr[0]; y = e.clientY - arr[1]; limitar(); }
  });
  const soltar = (e) => { dedos.delete(e.pointerId); if (dedos.size < 2) pinza = null; if (!dedos.size) { arr = null; esc_.style.cursor = ""; exportar(); } };
  esc_.addEventListener("pointerup", soltar); esc_.addEventListener("pointercancel", soltar);
  rango.oninput = () => {   // zoom alrededor del centro del recuadro
    const { H } = marco(); const s0 = parseFloat(im.style.transform.match(/scale\(([\d.]+)\)/)[1]), s = base * +rango.value;
    const cx = mx + mw / 2, cy = H / 2; x = cx - (cx - x) * s / s0; y = cy - (cy - y) * s / s0; limitar(); exportar();
  };
  return el;
}

function tablaEditable(cont, t, cols, opc = {}) {
  const c = cab(t); const idx = cols.map((k) => c.indexOf(k));
  let filas = (t || []).slice(1).map((f) => idx.map((i) => (i >= 0 ? f[i] || "" : ""))).filter((f) => f.some((x) => x.trim()));

  const body = tb.querySelector("tbody");

    body.innerHTML = "";

      const tr = document.createElement("tr");
      cols.forEach((k, j) => {
        const td = document.createElement("td");
        if (opc.soloLectura && opc.soloLectura.includes(k)) { td.innerHTML = `<b style="font-size:14px">${esc(f[j])}</b>`; }
        else if (opc.opciones && opc.opciones[k]) { td.innerHTML = `<select>${["", ...opc.opciones[k]].map((o) => `<option${o === f[j] ? " selected" : ""}>${esc(o)}</option>`).join("")}${f[j] && !opc.opciones[k].includes(f[j]) ? `<option selected>${esc(f[j])}</option>` : ""}</select>`; td.firstChild.onchange = (e) => { f[j] = e.target.value; opc.onCambio && opc.onCambio(); }; }
        else { td.innerHTML = `<input type="text" value="${esc(f[j])}">`; td.firstChild.oninput = (e) => { f[j] = e.target.value; opc.onCambio && opc.onCambio(); if (opc.imagen === k) { const i = tr.querySelector(".esc img"); if (i) i.src = img(f[j]); } }; }
        tr.appendChild(td);
      });
      if (opc.imagen) { const td = document.createElement("td"); td.className = "esc"; td.innerHTML = `<img src="${esc(img(f[cols.indexOf(opc.imagen)]))}" onerror="this.style.visibility='hidden'">`; tr.insertBefore(td, tr.children[cols.indexOf(opc.imagen) + 1] || null); }
      if (!opc.fijas) { const td = document.createElement("td"); td.className = "quitar"; td.innerHTML = `<button title="Quitar">✕</button>`; td.firstChild.onclick = () => { filas.splice(r, 1); dibujar(); }; tr.appendChild(td); }

function leerImagen(file, ancho, alto) {   // alto = null: solo achica; si no, recorta al centro con esa proporción
  return new Promise((ok, mal) => {
    const im = new Image(); im.onerror = () => mal(new Error("No pude leer esa imagen."));
    im.onload = () => {
      let sx = 0, sy = 0, sw = im.width, sh = im.height, w, hh;
      if (alto) { const r = ancho / alto; if (sw / sh > r) { sw = sh * r; sx = (im.width - sw) / 2; } else { sh = sw / r; sy = (im.height - sh) / 2; } w = ancho; hh = alto; }
      else { const k = Math.min(1, ancho / Math.max(sw, sh)); w = Math.round(sw * k); hh = Math.round(sh * k); }
      const c = document.createElement("canvas"); c.width = w; c.height = hh; c.getContext("2d").drawImage(im, sx, sy, sw, sh, 0, 0, w, hh);
      ok(c.toDataURL("image/jpeg", 0.85).split(",")[1]); URL.revokeObjectURL(im.src);
    };
    im.src = URL.createObjectURL(file);
  });
}
const aBase64 = (file) => new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.readAsDataURL(file); });
// muestra la foto o acreditación y, si hay dónde, pone los botones «Ver» y «Descargar»
async function mostrarArchivo(caja, email, tipo, botones) {
  try {
    const a = await srv("verArchivoPerfil", email, tipo); if (!a) return;
    if (a.mime === "application/pdf") { caja.textContent = "PDF cargado ✓"; caja.style.backgroundImage = ""; }
    else { caja.style.backgroundImage = `url(data:${a.mime};base64,${a.datos})`; caja.textContent = ""; }
    caja.classList.add("ok");
    if (botones) archivoBotones(botones, a, (tipo === "acred" ? "acreditacion-" : "foto-carnet-") + email.split("@")[0]);
  } catch (e) {}
}
function archivoBotones(cont, a, nombre) {
  const bytes = Uint8Array.from(atob(a.datos), (c) => c.charCodeAt(0));
  const url = URL.createObjectURL(new Blob([bytes], { type: a.mime })), ext = a.mime === "application/pdf" ? ".pdf" : ".jpg";
  cont.innerHTML = `<a class="btn sec chico" href="${url}" target="_blank" rel="noopener">Ver</a><a class="btn sec chico" href="${url}" download="${esc(nombre + ext)}">Descargar</a>`;
  cont.hidden = false;
}

let subConv = "calendario", mesConv = null, convSel = null, CV = null, sugPartidos = null;
async function partidosProximos() {   // próximos partidos (ESPN) para sugerir en la convocatoria
  if (sugPartidos) return sugPartidos;
  const ligas = [["uru.1", "Campeonato Uruguayo"], ["conmebol.libertadores", "Copa Libertadores"], ["conmebol.sudamericana", "Copa Sudamericana"]];
  const ymd = (d) => d.toLocaleDateString("en-CA", { timeZone: "America/Montevideo" });
  const pedidos = [];
  for (let i = 0; i < 21; i++) { const d = ymd(new Date(Date.now() + i * 864e5)).replace(/-/g, "");
    ligas.forEach(([l, nom]) => pedidos.push(fetch("https://site.api.espn.com/apis/site/v2/sports/soccer/" + l + "/scoreboard?dates=" + d).then((r) => r.json()).then((j) => (j.events || []).map((ev) => {
      const co = ev.competitions[0], eq = co.competitors || [], loc = eq.find((x) => x.homeAway === "home") || eq[0], vis = eq.find((x) => x.homeAway === "away") || eq[1];
      const f = new Date(ev.date);
      return { fecha: ymd(f), hora: f.toLocaleTimeString("es-UY", { timeZone: "America/Montevideo", hour: "2-digit", minute: "2-digit", hour12: false }),
               local: loc && loc.team.displayName, visitante: vis && vis.team.displayName, competencia: nom, locacion: (co.venue && co.venue.fullName) || "", hecho: ev.status && ev.status.type && ev.status.type.completed };
    })).catch(() => [])));
  }
  const vistos = new Set();
  sugPartidos = (await Promise.all(pedidos)).flat().filter((p) => p.local && !p.hecho && !vistos.has(p.fecha + p.local) && vistos.add(p.fecha + p.local)).sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
  return sugPartidos;
}

};

/* ---------- Ingreso con código por mail (panel abierto desde GitHub) ---------- */
function ingresar() {
  return new Promise((listo) => {
    const C = document.getElementById("cargando");
    const pedir = (fn, x) => fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ fn }, x)) }).then((r) => r.json()).then((r) => { if ("error" in r) throw new Error(r.error); return r.ok; });
    C.innerHTML = `<form class="ingreso"><div class="marca-ing"><b>13<i>a</i>0</b><span>Panel</span></div>
      <label>Tu cuenta de Gmail<input type="email" name="email" autocomplete="email" required placeholder="nombre@gmail.com"></label>
      <label hidden>Código que te llegó por mail<input name="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"></label>
      <button class="btn">Mandame el código</button><small></small></form>`;
    const F = C.querySelector("form"), M = F.email, K = F.codigo, B = F.querySelector("button"), T = F.querySelector("small");
    M.value = guardado("panel13a0.email") || "";
    F.onsubmit = async (e) => {
      e.preventDefault(); B.disabled = true; T.style.color = "";
      try {
        if (K.parentNode.hidden) {
          await pedir("pedirCodigo", { email: M.value });
          guardado("panel13a0.email", M.value.trim().toLowerCase());
          K.parentNode.hidden = false; K.required = true; K.focus(); M.readOnly = true; B.textContent = "Entrar";
          T.textContent = "Si la cuenta tiene acceso, te llegó un mail con el código (mirá también en Spam).";
        } else {
          const r = await pedir("validarCodigo", { email: M.value, codigo: K.value });
          guardado("panel13a0.ses", r.ses); C.innerHTML = "Cargando el panel…"; listo();
        }
      } catch (x) { T.style.color = "var(--rojo)"; T.textContent = x.message || String(x); }
      B.disabled = false;
    };
  });
}
function salir() { if (API) { srv("salir").catch(() => {}); guardado("panel13a0.ses", null); location.reload(); } }
(async () => {
  try { if (API && !guardado("panel13a0.ses")) await ingresar(); await cargar(); document.getElementById("cargando").remove(); ir(new URLSearchParams(location.search).get("seccion") || "inicio"); }
  catch (e) { document.getElementById("cargando").innerHTML = `<div style="max-width:560px;text-align:center;padding:20px">${esc(e.message || e)}</div>`; }
})();
</script>
