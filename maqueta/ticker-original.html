<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ticker 13a0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500..900&family=Bitter:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="barra">
  <div class="marca" id="marca"></div>
  <div class="viewport" id="viewport"></div>
  <div class="reloj" id="reloj"><span class="hh">00</span><span class="dos">:</span><span class="mm">00</span></div>
</div>

<script src="config.js"></script>
<script src="comun.js"></script>
<script src="demo-datos.js"></script>
<script>
(function () {
  const T = window.Ticker, C = T.config;
  const BASE = "https://site.api.espn.com/apis/site/v2/sports/";
  const BANDERA_URU = "https://a.espncdn.com/i/teamlogos/countries/500/uru.png";
  if (T.params.has("sinlogo")) document.getElementById("marca").remove();   // en la pantalla de tanda el logo va arriba
  else T.marca(document.getElementById("marca"));

  /* ==============================================================
     1) DATOS DE RESULTADOS
     ============================================================== */
  const datos = {};          // liga -> { nombre, logo, partidos: [] }  (ya filtrados y ordenados)
  const ligaFallida = {};
  let manuales = {};         // competencia -> { logo, partidos }
  let uru = { equipos: {}, atletas: {}, fecha: 0 };

  const comps = C.competencias || [];
  const extra = (C.exterior && C.exterior.activo) ? (C.exterior.competenciasExtra || []) : [];
  const ligasPropias = new Set(comps.map((c) => c.liga));
  const extraSinRepetir = extra.filter((c) => !ligasPropias.has(c.liga));
  const FC = C.fechaCompleta || {};
  const ligasFechaCompleta = new Set(FC.ligas || ["uru.1", "uru.2"]);

  // Días calendario relativos a hoy, en la zona horaria del programa
  const fmtDia = new Intl.DateTimeFormat("en-CA", { year: "numeric", month: "2-digit", day: "2-digit", timeZone: C.zonaHoraria || undefined });
  const fmtSemana = new Intl.DateTimeFormat("es-UY", { weekday: "short", timeZone: C.zonaHoraria || undefined });
  function diaRelativo(iso) {
    const a = fmtDia.format(new Date(iso)), h = fmtDia.format(new Date());
    return Math.round((Date.parse(a + "T00:00:00Z") - Date.parse(h + "T00:00:00Z")) / 864e5);
  }
  function fechaConsulta(k) { return fmtDia.format(new Date(Date.now() + k * 864e5)).replace(/-/g, ""); }

  function etiquetaEstado(st, deporte, inicio) {
    const ty = (st && st.type) || {};
    const n = ty.name || "";
    if (ty.state === "pre") {
      if (/POSTPONED/.test(n)) return "Postergado";
      if (/CANCELED|CANCELLED|ABANDONED|FORFEIT|SUSPENDED/.test(n)) return "Suspendido";
      if (/DELAYED/.test(n)) return "Demorado";
      const d = T.diaCorto(inicio);
      return (d ? d + " " : "") + T.hora(inicio);
    }
    if (ty.state === "in") {
      if (/HALFTIME/.test(n)) return "Entretiempo";
      if (/SHOOTOUT/.test(n)) return "Penales";
      if (deporte === "basketball") {
        if (/END_PERIOD/.test(n)) return "Fin " + st.period + "C";
        return (st.period > 4 ? "Alarg." : st.period + "C") + " " + (st.displayClock || "");
      }
      if (/END_OF_REGULATION|END_OF_EXTRATIME/.test(n)) return "Fin " + (st.displayClock || "");
      if (/OVERTIME|EXTRA/.test(n)) return "Alarg. " + (st.displayClock || "");
      return st.displayClock || "En vivo";
    }
    if (/POSTPONED/.test(n)) return "Postergado";
    if (/CANCELED|CANCELLED|ABANDONED|SUSPENDED/.test(n)) return "Suspendido";
    if (diaRelativo(inicio) < 0) return "Final · " + fmtSemana.format(new Date(inicio)).replace(".", "");
    return "Final";
  }

  // "N. de la Cruz" → "de la Cruz";  "Luis Suárez" → "Suárez"
  // Nombre y apellido: "Federico Valverde"
  function nombreCompleto(a) {
    const n = (a.displayName || a.fullName || [a.firstName, a.lastName].filter(Boolean).join(" ") || "").trim();
    return n || apellido(a);
  }

  function apellido(a) {
    if (a.shortName && /^\S{1,3}\.\s/.test(a.shortName)) return a.shortName.replace(/^\S{1,3}\.\s+/, "");
    if (a.lastName) return a.lastName;
    const n = (a.displayName || a.shortName || "").trim().split(/\s+/);
    return n.length > 1 ? n.slice(1).join(" ") : n[0] || "";
  }

  function normalizar(ev, deporte) {
    const comp = (ev.competitions || [])[0] || {};
    const st = comp.status || ev.status || {};
    const cs = comp.competitors || [];
    const loc = cs.find((c) => c.homeAway === "home") || cs[0] || {};
    const vis = cs.find((c) => c.homeAway === "away") || cs[1] || {};
    const inicio = comp.date || ev.date;
    const estado = (st.type && st.type.state) || "pre";
    const eq = (c) => ({
      id: c.team && String(c.team.id),
      nombre: (c.team && (c.team.shortDisplayName || c.team.displayName || c.team.name)) || "",
      completo: (c.team && c.team.displayName) || "",
      logo: (c.team && (c.team.logo || (c.team.logos && c.team.logos[0] && c.team.logos[0].href))) || "",
      goles: c.score != null ? String(c.score) : "",
      penales: c.shootoutScore != null ? String(c.shootoutScore) : "",
      gano: !!c.winner
    });
    const goles = [];
    (comp.details || []).forEach((d) => {
      if (!d.scoringPlay || d.shootout || !d.athletesInvolved || !d.athletesInvolved[0]) return;
      const a = d.athletesInvolved[0];
      goles.push({
        equipo: d.team && String(d.team.id),
        atleta: String(a.id),
        jugador: apellido(a),
        min: (d.clock && d.clock.displayValue) || "",
        pen: !!d.penaltyKick, ec: !!d.ownGoal
      });
    });
    return {
      id: String(ev.id), deporte, inicio, estado, dia: diaRelativo(inicio),
      etiqueta: etiquetaEstado(st, deporte, inicio),
      local: eq(loc), visita: eq(vis), goles,
      golesPorJugador: goles.filter((g) => !g.ec).map((g) => g.atleta)
    };
  }

  // Orden dentro de cada competencia: en vivo → terminados → por jugarse (cada grupo por horario)
  const RANGO = { in: 0, post: 1, pre: 2 };
  function ordenar(a, b) {
    return (RANGO[a.estado] ?? 1) - (RANGO[b.estado] ?? 1) || new Date(a.inicio) - new Date(b.inicio);
  }

  /* Fútbol uruguayo: si hay una fecha en juego (hoy cae dentro de un grupo de
     días seguidos con partidos), se muestra la fecha completa. */
  // Agrupa los días con partidos en "fechas" (días seguidos, con hasta N días libres en el medio).
  // Si hoy cae dentro de una fecha → esa fecha completa (jugados + por jugar).
  // Si no → la próxima fecha (día y hora de cada partido).
  function filtrarFechaCompleta(partidos) {
    const sep = FC.separacionMaxDias == null ? 1 : FC.separacionMaxDias;
    const dias = [...new Set(partidos.map((p) => p.dia))].sort((a, b) => a - b);
    const grupos = [];
    dias.forEach((d, i) => {
      if (!i || d - dias[i - 1] > sep + 1) grupos.push([]);
      grupos[grupos.length - 1].push(d);
    });
    const actual = grupos.find((g) => g[0] <= 0 && g[g.length - 1] >= 0);
    if (actual) {
      const set = new Set(actual);
      return { partidos: partidos.filter((p) => p.estado === "in" || set.has(p.dia)), proxima: false };
    }
    const vivos = partidos.filter((p) => p.estado === "in");
    if (vivos.length) return { partidos: vivos, proxima: false };
    const sig = grupos.find((g) => g[0] > 0);
    if (!sig) return { partidos: [], proxima: false };
    const set = new Set(sig);
    return { partidos: partidos.filter((p) => set.has(p.dia)), proxima: true };
  }

  /* Uruguayos */
  function uruDeEquipo(id) { return (id && uru.equipos[id] && !esClubUruguayo(id)) ? uru.equipos[id].jugadores : null; }
  function tieneUru(p) {
    if (/^uruguay$/i.test(p.local.completo) || /^uruguay$/i.test(p.visita.completo)) return true;
    return !!((!esClubUruguayo(p.local.id) && uruDeEquipo(p.local.id)) || (!esClubUruguayo(p.visita.id) && uruDeEquipo(p.visita.id)));
  }

  /* Carga: un día por consulta. Hoy se consulta en cada vuelta; los demás
     días (solo para el fútbol uruguayo) cada 15 minutos. */
  const cacheDias = {};
  const estadoCarga = { ok: 0, error: 0, ultimoError: "" };
  let vueltaCompleta = false;

  async function cargarLiga(deporte, liga, nombre, soloUruguayos) {
    if (ligaFallida[liga] && Date.now() - ligaFallida[liga] < 5 * 60e3) return;
    const ruta = (deporte === "basketball" ? "basketball/" : "soccer/") + liga;
    const cache = (cacheDias[liga] = cacheDias[liga] || {});
    const completa = ligasFechaCompleta.has(liga);
    const atras = completa ? (FC.buscarDias == null ? 4 : FC.buscarDias) : 0;
    const adelante = completa ? (FC.buscarDiasAdelante == null ? 14 : FC.buscarDiasAdelante) : 0;
    const fechas = [];
    for (let k = -atras; k <= adelante; k++) fechas.push({ k, f: fechaConsulta(k) });

    let algunOk = false, ultimoError = null;
    for (const { k, f } of fechas) {
      const c = cache[f];
      // hoy: en cada vuelta · ayer/mañana: cada 15 min · días más lejanos: cada hora
      if (c && k !== 0 && Date.now() - c.t < (Math.abs(k) <= 1 ? 15 : 60) * 60e3) { algunOk = true; continue; }
      try {
        const j = await T.fetchJSON(BASE + ruta + "/scoreboard?dates=" + f);
        const lg = (j.leagues || [])[0] || {};
        cache[f] = { t: Date.now(), eventos: j.events || [], logo: (lg.logos && lg.logos[0] && lg.logos[0].href) || "" };
        algunOk = true;
      } catch (e) { ultimoError = e; }
      await T.esperar(150);
    }
    const vigentes = new Set(fechas.map((x) => x.f));
    Object.keys(cache).forEach((f) => { if (!vigentes.has(f)) delete cache[f]; });

    if (!algunOk) {
      ligaFallida[liga] = Date.now();
      estadoCarga.error++;
      estadoCarga.ultimoError = ultimoError ? ultimoError.message : "";
      return;
    }
    delete ligaFallida[liga];
    estadoCarga.ok++;
    const vistos = new Set();
    let partidos = [], logo = "";
    Object.values(cache).forEach((c) => {
      if (c.logo) logo = c.logo;
      c.eventos.forEach((e) => {
        if (vistos.has(String(e.id))) return;
        vistos.add(String(e.id));
        partidos.push(normalizar(e, deporte));
      });
    });
    let proxima = false;
    if (completa) { const r = filtrarFechaCompleta(partidos); partidos = r.partidos; proxima = r.proxima; }
    else partidos = partidos.filter((p) => p.dia === 0 || p.estado === "in");
    if (/^uru\./.test(liga)) Object.values(cache).forEach((c) => c.eventos.forEach((ev) =>
      (((ev.competitions || [])[0] || {}).competitors || []).forEach((cp) => cp.team && marcarClubUruguayo(cp.team.id))));
    // partidos con equipos "a definir" no se muestran hasta que la fuente cargue los nombres
    partidos = partidos.filter((p) => !/^tbd\b/i.test(p.local.completo || p.local.nombre) && !/^tbd\b/i.test(p.visita.completo || p.visita.nombre));
    datos[liga] = { nombre, logo, proxima, partidos: partidos.sort(ordenar) };
    actualizarEnPantalla(liga);
  }

  async function cargarManuales() {
    try {
      const filas = await T.leerHoja(C.hojaResultadosManuales || "resultados_manuales");
      if (!filas) return;
      const nuevo = {};
      filas.forEach((f, i) => {
        if (!T.esSi(f.mostrar)) return;
        const comp = f.competencia || "Resultados";
        const est = f.estado || "";
        const vivo = /vivo|\d+'|\d+\s*c\b|cuarto|tiempo|^q\d/i.test(est);
        const fin = /final|termin/i.test(est);
        const p = {
          id: "m" + i, deporte: "manual", dia: 0, inicio: "",
          estado: vivo ? "in" : (fin ? "post" : (f.goles_local || f.goles_visitante ? "post" : "pre")),
          etiqueta: est,
          local: { nombre: f.local || "", logo: T.urlImagen(f.logo_local), goles: f.goles_local || "", gano: false },
          visita: { nombre: f.visitante || "", logo: T.urlImagen(f.logo_visitante), goles: f.goles_visitante || "", gano: false },
          goles: [], golesPorJugador: []
        };
        const gl = parseFloat(p.local.goles), gv = parseFloat(p.visita.goles);
        if (p.estado === "post" && !isNaN(gl) && !isNaN(gv)) { p.local.gano = gl > gv; p.visita.gano = gv > gl; }
        const n = (nuevo[comp] = nuevo[comp] || { logo: "", partidos: [] });
        if (f.logo_competencia && !n.logo) n.logo = T.urlImagen(f.logo_competencia);
        n.partidos.push(p);
      });
      Object.values(nuevo).forEach((n) => n.partidos.sort((x, y) => (RANGO[x.estado] ?? 1) - (RANGO[y.estado] ?? 1)));
      manuales = nuevo;
    } catch (e) { console.warn("No se pudo leer la planilla", e.message); }
  }

  async function cicloDatos() {
    for (;;) {
      if (T.demo) {
        window.TickerDemo.cargarResultados(datos, (u) => { uru = u; });
        manuales = window.TickerDemo.manuales;
        vueltaCompleta = true;
      } else {
        for (const c of comps) await cargarLiga(c.deporte || "soccer", c.liga, c.nombre, false);
        for (const c of extraSinRepetir) await cargarLiga("soccer", c.liga, c.nombre, true);
        await cargarManuales();
        vueltaCompleta = true;
      }
      await T.esperar((C.actualizarCadaSegundos || 60) * 1000);
    }
  }

  /* Escaneo semanal de planteles para detectar uruguayos */
  async function escanearUruguayos() {
    if (T.demo || !C.exterior || !C.exterior.activo) return;
    const cada = (C.exterior.escanearCadaDias || 7) * 864e5;
    let prog = T.leer("ticker_escaneo", null);
    const forzar = T.params.has("escanear");
    if (!prog && !forzar && uru.fecha && Date.now() - uru.fecha < cada) { setTimeout(escanearUruguayos, 6 * 36e5); return; }
    if (!prog || forzar) prog = { ligas: (C.exterior.ligasAEscanear || []).slice(), equipos: [], res: { equipos: {}, atletas: {} } };
    while (prog.ligas.length || prog.equipos.length) {
      if (!prog.equipos.length) {
        const liga = prog.ligas.shift();
        try {
          const j = await T.fetchJSON(BASE + "soccer/" + liga + "/teams");
          const ts = (((j.sports || [])[0] || {}).leagues || [])[0];
          prog.equipos = ((ts && ts.teams) || []).map((t) => ({ id: t.team.id, nombre: t.team.displayName, liga }));
        } catch (e) { /* liga sin equipos */ }
        T.guardar("ticker_escaneo", prog);
        await T.esperar(700);
        continue;
      }
      const eq = prog.equipos.shift();
      if (!prog.res.equipos[eq.id]) {
        try {
          const j = await T.fetchJSON(BASE + "soccer/" + eq.liga + "/teams/" + eq.id + "/roster", 25000);
          const jug = (j.athletes || []).filter((a) =>
            a.citizenship === "Uruguay" || (a.citizenshipCountry && a.citizenshipCountry.abbreviation === "URU"));
          if (jug.length) {
            prog.res.equipos[eq.id] = { nombre: eq.nombre, jugadores: jug.map((a) => apellido(a)) };
            jug.forEach((a) => { prog.res.atletas[a.id] = apellido(a); });
          }
        } catch (e) { /* equipo sin plantel */ }
      }
      T.guardar("ticker_escaneo", prog);
      await T.esperar(900);
    }
    uru = { equipos: prog.res.equipos, atletas: prog.res.atletas, fecha: Date.now() };
    T.guardar("ticker_uruguayos", uru);
    try { localStorage.removeItem("ticker_escaneo"); } catch (e) {}
    setTimeout(escanearUruguayos, 6 * 36e5);
  }

  /* ==============================================================
     2a) PLANTELES: qué equipos que juegan HOY tienen uruguayos.
     Se consulta el plantel de cada equipo extranjero que juega hoy
     (una vez por semana por equipo; queda guardado).
     ============================================================== */
  const clubesUru = T.leer("ticker_clubes_uru", { t: 0, ids: [] });
  let setClubesUru = new Set(T.demo ? (window.TickerDemo.clubesUru || []) : clubesUru.ids);
  function esClubUruguayo(id) { return !!id && setClubesUru.has(String(id)); }
  function marcarClubUruguayo(id) {
    id = String(id);
    if (!id || setClubesUru.has(id)) return;
    setClubesUru.add(id);
    clubesUru.extra = [...new Set([...(clubesUru.extra || []), id])];
    clubesUru.ids = [...new Set([...clubesUru.ids, id])];
    T.guardar("ticker_clubes_uru", clubesUru);
  }
  async function cargarClubesUruguayos() {
    if (T.demo || (clubesUru.ids.length && Date.now() - clubesUru.t < 7 * 864e5)) return;
    const ids = [];
    for (const liga of FC.ligas || ["uru.1", "uru.2"]) {
      try {
        const j = await T.fetchJSON(BASE + "soccer/" + liga + "/teams");
        const ts = (((j.sports || [])[0] || {}).leagues || [])[0];
        ((ts && ts.teams) || []).forEach((t) => ids.push(String(t.team.id)));
      } catch (e) { /* se reintenta en la próxima carga */ }
    }
    if (ids.length) {
      ids.push(...(clubesUru.extra || []));
      clubesUru.t = Date.now(); clubesUru.ids = ids; setClubesUru = new Set(ids);
      T.guardar("ticker_clubes_uru", clubesUru);
      Object.keys(datos).forEach(actualizarEnPantalla);
    }
  }

  const planteles = T.leer("ticker_planteles_v2", {});   // idEquipo -> { t, nombre, ids: { idAtleta: nombre completo } }
  function aplicarPlanteles() {
    Object.keys(planteles).forEach((id) => {
      const ids = planteles[id].ids || {};
      const nombres = Object.values(ids);
      if (nombres.length) uru.equipos[id] = { nombre: planteles[id].nombre, jugadores: nombres };
      else delete uru.equipos[id];
      Object.assign(uru.atletas, ids);
    });
  }
  aplicarPlanteles();

  function esUruguayo(a) {
    return a.citizenship === "Uruguay" || (a.citizenshipCountry && a.citizenshipCountry.abbreviation === "URU") ||
      (a.flag && /\/uru\.png|uruguay/i.test((a.flag.href || "") + " " + (a.flag.alt || "")));
  }

  async function cargarPlantel(liga, e) {
    try {
      const j = await T.fetchJSON(BASE + "soccer/" + liga + "/teams/" + e.id + "/roster", 20000);
      const ids = {};
      const todos = j.athletes || [];
      todos.forEach((a) => { if (esUruguayo(a)) ids[a.id] = nombreCompleto(a); });
      if (todos.length >= 8 && Object.keys(ids).length / todos.length >= 0.5) marcarClubUruguayo(e.id);
      planteles[e.id] = { t: Date.now(), nombre: e.completo || e.nombre, ids };
      T.guardar("ticker_planteles_v2", planteles);
      aplicarPlanteles();
      return true;
    } catch (err) { return false; }
  }

  const plantelFallido = {};
  async function cicloPlanteles() {
    if (T.demo) return;
    for (;;) {
      const pendientes = [], vistos = new Set();
      Object.keys(datos).forEach((liga) => {
        if (/^uru\./.test(liga)) return;
        datos[liga].partidos.forEach((p) => {
          if (p.deporte !== "soccer") return;
          [p.local, p.visita].forEach((e) => {
            if (!e.id || vistos.has(e.id) || /^uruguay$/i.test(e.completo || "") || esClubUruguayo(e.id)) return;
            vistos.add(e.id);
            const c = planteles[e.id];
            if (c && Date.now() - c.t < 7 * 864e5) return;
            if (plantelFallido[e.id] && Date.now() - plantelFallido[e.id] < 30 * 60e3) return;
            pendientes.push({ liga, e, prio: RANGO[p.estado] ?? 1 });
          });
        });
      });
      pendientes.sort((a, b) => a.prio - b.prio);   // primero los partidos en vivo y terminados
      for (const x of pendientes) {
        const ok = await cargarPlantel(x.liga, x.e);
        if (!ok) plantelFallido[x.e.id] = Date.now();
        else if (planteles[x.e.id] && Object.keys(planteles[x.e.id].ids).length) actualizarEnPantalla(x.liga);
        await T.esperar(250);
      }
      await T.esperar(15000);
    }
  }

  /* ==============================================================
     2) URUGUAYOS QUE JUGARON (formaciones de cada partido)
     Solo para partidos de ligas extranjeras con equipos que tienen
     uruguayos. Se consulta la formación del partido: titulares e ingresos.
     ============================================================== */
  const formaciones = {};   // idPartido -> { t, porEquipo: { idEquipo: [ {nombre, titular, ingreso, min} ] } }
  const consultando = new Set();

  function necesitaFormacion(liga, p) {
    if (T.demo || p.deporte !== "soccer" || /^uru\./.test(liga)) return false;
    if (!(uruDeEquipo(p.local.id) || uruDeEquipo(p.visita.id))) return false;
    const f = formaciones[p.id];
    if (p.estado === "pre") {
      const falta = new Date(p.inicio) - Date.now();
      if (falta > 90 * 60e3) return false;                 // la formación sale ~1 h antes
      return !f || Date.now() - f.t > 10 * 60e3;
    }
    if (p.estado === "in") return !f || Date.now() - f.t > 3 * 60e3;
    return !f || !f.final;                                  // terminado: una última vez
  }

  const CORE = "https://sports.core.api.espn.com/v2/sports/soccer/leagues/";
  const si = (v) => v === true || !!(v && v.didSub);

  async function cargarFormacion(liga, p) {
    if (consultando.has(p.id)) return;
    consultando.add(p.id);
    const porEquipo = {};
    let hay = false;
    const agregar = (idEq, aid, nombreAtleta, titular, ingreso, min) => {
      const lista = (porEquipo[idEq] = porEquipo[idEq] || []);
      if (lista.some((x) => x.id === aid)) return;
      lista.push({ id: aid, nombre: uru.atletas[aid] || nombreAtleta, titular, ingreso, min });
    };
    try {
      const j = await T.fetchJSON(BASE + "soccer/" + liga + "/summary?event=" + p.id, 20000);
      (j.rosters || []).forEach((r) => {
        const idEq = r.team && String(r.team.id);
        (r.roster || []).forEach((e) => {
          const a = e.athlete || {};
          const aid = String(a.id || e.playerId || "");
          if (!(uru.atletas[aid] || esUruguayo(a))) return;
          hay = true;
          let min = "";
          (e.plays || []).forEach((pl) => { if (pl.substitution && pl.clock && si(e.subbedIn)) min = pl.clock.displayValue || ""; });
          agregar(idEq, aid, nombreCompleto(a), !!e.starter, si(e.subbedIn), min);
        });
        if ((r.roster || []).length) hay = true;
      });
      // Cambios informados como eventos del partido (por si la formación no trae los ingresos)
      (j.keyEvents || []).forEach((k) => {
        const tipo = ((k.type && (k.type.type || k.type.text)) || "").toLowerCase();
        if (!/substitution|sustituci|cambio/.test(tipo)) return;
        (k.participants || []).forEach((pt) => {
          const aid = String((pt.athlete && pt.athlete.id) || "");
          if (!uru.atletas[aid]) return;
          const idEq = String((k.team && k.team.id) || "");
          const lista = porEquipo[idEq] || [];
          const x = lista.find((y) => y.id === aid);
          if (x && !x.titular && !x.ingreso) { x.ingreso = true; x.min = (k.clock && k.clock.displayValue) || ""; }
        });
      });
    } catch (e) { /* sin resumen */ }

    // Respaldo: formación por equipo desde la otra API de la fuente (titulares)
    if (!hay) {
      for (const e of [p.local, p.visita]) {
        if (!uruDeEquipo(e.id)) continue;
        try {
          const r = await T.fetchJSON(CORE + liga + "/events/" + p.id + "/competitions/" + p.id + "/competitors/" + e.id + "/roster", 15000);
          (r.entries || []).forEach((en) => {
            hay = true;
            const aid = String(en.playerId || "");
            if (uru.atletas[aid]) agregar(e.id, aid, uru.atletas[aid], !!en.starter, si(en.subbedIn), "");
          });
        } catch (err) { /* sin formación */ }
      }
    }
    formaciones[p.id] = { t: Date.now(), final: p.estado === "post" && hay, hay, porEquipo };
    consultando.delete(p.id);
    actualizarEnPantalla(liga);
  }

  async function cicloFormaciones() {
    for (;;) {
      const pendientes = [];
      Object.keys(datos).forEach((liga) => datos[liga].partidos.forEach((p) => { if (necesitaFormacion(liga, p)) pendientes.push([liga, p]); }));
      for (const [liga, p] of pendientes) { await cargarFormacion(liga, p); await T.esperar(400); }
      await T.esperar(20000);
    }
  }

  // Texto de uruguayos para un equipo: quiénes jugaron (o el plantel si no hay formación)
  function uruguayosDe(p, e) {
    if (p.deporte !== "soccer" || /^uru\./.test(p.liga || "") || esClubUruguayo(e.id)) return null;
    const plantel = uruDeEquipo(e.id);
    if (!plantel || !plantel.length) return null;
    const f = formaciones[p.id];
    if (T.demo && p.demoUru) return p.demoUru[e.id] || null;
    if (f && f.hay) {
      const js = f.porEquipo[e.id] || [];
      const jugaron = js.filter((x) => x.titular || x.ingreso);
      if (jugaron.length) return jugaron.map((x) => x.nombre + (x.titular ? " (titular)" : " (ingresó" + (x.min ? " " + x.min : "") + ")"));
      if (p.estado === "pre") return js.length ? js.map((x) => x.nombre + " (suplente)") : null;
      return p.estado === "post" && js.length ? [js.map((x) => x.nombre).join(", ") + ": no jugó"] : null;
    }
    return plantel.slice(0, 3);   // sin formación todavía: solo el plantel
  }

  /* ==============================================================
     3) CINTA DE RESULTADOS (corre de costado)
     ============================================================== */
  function goleadoresDe(p, equipoId) {
    const porJugador = new Map();
    (p.goles || []).filter((g) => g.equipo === equipoId).forEach((g) => {
      const clave = g.atleta + (g.ec ? "ec" : "");
      if (!porJugador.has(clave)) porJugador.set(clave, { jugador: g.jugador, atleta: g.atleta, equipo: g.equipo, ec: g.ec, uru: !g.ec && !esPartidoUruguayo(p) && !esClubUruguayo(g.equipo) && !!uru.atletas[g.atleta], mins: [] });
      porJugador.get(clave).mins.push(g.min + (g.pen ? " (p)" : ""));
    });
    return [...porJugador.values()];
  }

  function esPartidoUruguayo(p) {
    return /^uru\./.test(p.liga || "") || /^uruguay$/i.test(p.local.completo || "") || /^uruguay$/i.test(p.visita.completo || "");
  }
  function golesUruDe(p) {
    if (p.deporte !== "soccer" || esPartidoUruguayo(p)) return [];
    return [p.local, p.visita].flatMap((e) => goleadoresDe(p, e.id)).filter((g) => g.uru)
      .map((g) => Object.assign({}, g, { jugador: uru.atletas[g.atleta] || g.jugador }));   // nombre y apellido
  }

  function equipoBloque(p, e, lado) {
    const perdio = p.estado === "post" && !e.gano && (p.local.gano || p.visita.gano);
    const d = T.el("div", "equipo " + lado + (perdio ? " perdio" : ""));
    const f1 = T.el("div", "fila1");
    if (e.logo) f1.appendChild(T.img(e.logo));
    f1.appendChild(T.el("span", "nom", e.nombre));
    d.appendChild(f1);
    const gs = p.deporte === "soccer" ? goleadoresDe(p, e.id) : [];
    if (gs.length) {
      const fila = T.el("div", "goleadores");
      gs.forEach((g, i) => {
        if (i) fila.appendChild(document.createTextNode(" "));
        const s = T.el("span", "gol" + (g.uru ? " uru-gol" : ""));
        s.appendChild(T.el("b", null, g.jugador + (g.ec ? " (e/c)" : "")));
        s.appendChild(document.createTextNode(" " + g.mins.join(" ")));
        fila.appendChild(s);
      });
      d.appendChild(fila);
      ajustarGoleadores(d, f1, fila);
    } else d.classList.add("sin-goles");
    return d;
  }

  // Los goleadores no pueden hacer el bloque más ancho que el nombre del equipo:
  // si no entran, pasan a un segundo renglón.
  function ajustarGoleadores(d, f1, fila) {
    const aplicar = () => {
      if (!d.isConnected) return requestAnimationFrame(aplicar);
      const min = 210 * (T.unidad || 1);
      fila.style.maxWidth = Math.max(f1.offsetWidth, min) + "px";
    };
    fila.style.maxWidth = 210 * (T.unidad || 1) + "px";
    requestAnimationFrame(aplicar);
  }

  function llenarPartido(el, p, liga, opciones) {
    p.liga = liga;
    const anterior = el.dataset.goles;
    el.innerHTML = "";
    if (opciones && opciones.ligaMini) el.appendChild(T.el("span", "liga-mini", opciones.ligaMini));
    el.appendChild(equipoBloque(p, p.local, "local"));

    const m = T.el("div", "marcador " + (p.estado === "in" ? "vivo" : p.estado));
    let goles, estado = p.etiqueta;
    if (p.estado === "pre") {
      const mm = String(p.etiqueta || "").match(/^(.*\S)\s+(\d{1,2}:\d{2})$/);
      goles = mm ? mm[1] : "vs";
      if (mm) estado = mm[2];
    } else {
      goles = (p.local.goles || "0") + " - " + (p.visita.goles || "0");
      if (p.local.penales || p.visita.penales) goles += " (" + p.local.penales + "-" + p.visita.penales + ")";
    }
    m.appendChild(T.el("div", "goles", goles));
    m.appendChild(T.el("div", "estado", estado));
    if (anterior && anterior !== goles && p.estado === "in") m.classList.add("cambio");
    el.dataset.goles = goles;
    el.appendChild(m);

    el.appendChild(equipoBloque(p, p.visita, "visita"));

    // Uruguayos (fútbol extranjero): recuadro a la izquierda del local y a la derecha del visitante
    const izq = uruBloque(p, p.local), der = uruBloque(p, p.visita);
    if (izq) el.insertBefore(izq, el.querySelector(".equipo.local"));
    if (izq) izq.classList.add("lado-local");
    if (der) { der.classList.add("lado-visita"); el.appendChild(der); }
  }

  // Recuadro de uruguayos de UN equipo: goleadores (amarillo) y quiénes jugaron (celeste)
  function datosUru(p, e) {
    const goles = golesUruDe(p).filter((g) => g.equipo === e.id);
    const yaNombrados = new Set(goles.map((g) => g.jugador));
    const jugaron = (uruguayosDe(p, e) || []).filter((l) => ![...yaNombrados].some((n) => l === n || l.startsWith(n + " ")));
    return { goles, jugaron };
  }

  function uruBloque(p, e) {
    const { goles, jugaron } = datosUru(p, e);
    if (!goles.length && !jugaron.length) return null;
    const c = T.el("div", "uru" + (goles.length ? " con-gol" : ""));
    c.appendChild(T.img(BANDERA_URU));
    const txt = T.el("div", "uru-txt");
    if (goles.length) txt.appendChild(T.el("span", "titulo", goles.length > 1 ? "Goles uruguayos" : "Gol uruguayo"));
    goles.forEach((g) => txt.appendChild(T.el("span", "goleador", g.jugador + " " + g.mins.join(" "))));
    jugaron.slice(0, goles.length ? 1 : 3).forEach((l) => txt.appendChild(T.el("span", null, l)));
    c.appendChild(txt);
    return c;
  }

  function crearPartido(liga, p, opciones) {
    const el = T.el("div", "partido");
    el.dataset.k = liga + ":" + p.id;
    el.dataset.liga = liga;
    if (opciones && opciones.ligaMini) el.dataset.mini = opciones.ligaMini;
    llenarPartido(el, p, liga, opciones);
    return el;
  }

  function cabecera(nombre, logo, extraClase) {
    const c = T.el("div", "seg-cab" + (extraClase ? " " + extraClase : ""));
    if (logo) c.appendChild(T.img(logo));
    c.appendChild(T.el("span", null, nombre));
    return c;
  }

  // Actualiza en el lugar los partidos que ya están en pantalla
  function actualizarEnPantalla(liga) {
    if (!scroller) return;
    const d = datos[liga];
    if (d && d.partidos.length) arrancarSiEsperando();
    if (!d) return;
    const porId = {};
    d.partidos.forEach((p) => (porId[liga + ":" + p.id] = p));
    scroller.elementos(".partido").forEach((el) => {
      const p = porId[el.dataset.k];
      if (p) llenarPartido(el, p, liga, { ligaMini: el.dataset.mini });
    });
  }

  // Bloques en el orden en que corren: fútbol uruguayo → planilla → resto → exterior
  function bloques() {
    const out = [];
    const uruguayas = comps.filter((c) => /^uru\./.test(c.liga));
    const resto = comps.filter((c) => !/^uru\./.test(c.liga));
    const deLiga = (c) => {
      const d = datos[c.liga];
      if (!d) return;
      let ps = d.partidos;
      if (c.soloConUruguay) ps = ps.filter((p) => /^uruguay$/i.test(p.local.completo) || /^uruguay$/i.test(p.visita.completo));
      if (ps.length) out.push({ k: "L:" + c.liga, liga: c.liga, nombre: (c.nombre || d.nombre) + (d.proxima ? " · Próxima fecha" : ""), logo: d.logo, partidos: ps });
    };
    uruguayas.forEach(deLiga);
    Object.keys(manuales).forEach((n) => {
      if (manuales[n].partidos.length) out.push({ k: "M:" + n, liga: "M:" + n, nombre: n, logo: manuales[n].logo, partidos: manuales[n].partidos });
    });
    resto.forEach(deLiga);
    const ext = [];
    extraSinRepetir.forEach((c) => {
      const d = datos[c.liga];
      if (d) d.partidos.filter(tieneUru).forEach((p) => ext.push({ liga: c.liga, mini: c.nombre, p }));
    });
    if (ext.length) {
      ext.sort((a, b) => ordenar(a.p, b.p));
      out.push({ k: "EXT", ext: true, nombre: (C.exterior && C.exterior.titulo) || "Uruguayos en el exterior", items: ext });
    }
    return out;
  }

  function textoAviso() {
    if (T.demo) return "cargando…";
    if (estadoCarga.ok === 0 && estadoCarga.error > 0) return "sin conexión con los resultados";
    if (vueltaCompleta) return "hoy no hay partidos";
    return "cargando resultados…";
  }
  function refrescarAviso() { document.querySelectorAll(".aviso").forEach((el) => (el.textContent = textoAviso())); }
  function arrancarSiEsperando() {
    if (!scroller) return;
    const hijos = [...scroller.track.children];
    if (hijos.length && hijos.every((h) => h.classList.contains("esperando"))) { scroller.track.innerHTML = ""; scroller.x = 0; }
  }

  let ultimaClave = null;
  function proximoSegmento() {
    const bs = bloques();
    const seg = T.el("div", "seg");
    if (!bs.length) {
      seg.classList.add("esperando");
      seg.appendChild(T.el("div", "vacio aviso", textoAviso()));
      return seg;
    }
    const i = bs.findIndex((b) => b.k === ultimaClave);
    const b = bs[(i + 1) % bs.length];
    ultimaClave = b.k;
    if (b.ext) {
      seg.appendChild(cabecera(b.nombre, BANDERA_URU, "uru-cab"));
      b.items.forEach((it) => seg.appendChild(crearPartido(it.liga, it.p, { ligaMini: it.mini })));
    } else {
      seg.appendChild(cabecera(b.nombre, b.logo));
      b.partidos.forEach((p) => seg.appendChild(crearPartido(b.liga, p)));
    }
    return seg;
  }

  /* ==============================================================
     Compartir los resultados con la pantalla de tanda (si el ticker
     está adentro de ella). Se mandan ya ordenados por importancia.
     ============================================================== */
  function publicar() {
    if (window.parent === window) return;
    const items = [];
    bloques().forEach((b) => {
      const lista = b.ext ? b.items.map((it) => ({ liga: it.liga, comp: it.mini, logo: (datos[it.liga] || {}).logo, p: it.p }))
                          : b.partidos.map((p) => ({ liga: b.liga, comp: b.nombre, logo: b.logo, p }));
      lista.forEach(({ liga, comp, logo, p }) => {
        p.liga = liga;
        const eq = (e) => {
          const u = datosUru(p, e);
          return {
            nombre: e.nombre, logo: e.logo, goles: e.goles, gano: !!e.gano,
            goleadores: p.deporte === "soccer" ? goleadoresDe(p, e.id).map((g) => ({ jugador: g.jugador, mins: g.mins, ec: g.ec })) : [],
            uruGoles: u.goles.map((g) => g.jugador + " " + g.mins.join(" ")),
            uruJugaron: u.jugaron
          };
        };
        const local = eq(p.local), visita = eq(p.visita);
        const conUru = local.uruGoles.length + visita.uruGoles.length > 0;
        const prioridad = (p.estado === "in" ? 100 : p.estado === "post" ? 20 : 0) +
          (/^uru\./.test(liga) ? 50 : 0) + (conUru ? 40 : 0) +
          (local.uruJugaron.length + visita.uruJugaron.length ? 25 : 0);
        items.push({ k: liga + ":" + p.id, comp, logo: logo || "", estado: p.estado, etiqueta: p.etiqueta,
                     deporte: p.deporte, inicio: p.inicio, local, visita, prioridad });
      });
    });
    try { window.parent.postMessage({ tipo: "ticker-resultados", items }, "*"); } catch (e) {}
  }
  if (window.parent !== window) { setTimeout(publicar, 1500); setInterval(publicar, 4000); }

  /* ==============================================================
     Arranque
     ============================================================== */
  // Reloj (hora de Uruguay)
  const fmtHora = new Intl.DateTimeFormat("es-UY", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: C.zonaHoraria || undefined });
  function tic() {
    const [hh, mm] = fmtHora.format(new Date()).split(":");
    const r = document.getElementById("reloj");
    r.querySelector(".hh").textContent = hh;
    r.querySelector(".mm").textContent = mm;
  }
  if (C.reloj !== false) { tic(); setInterval(tic, 1000); } else document.getElementById("reloj").remove();

  let scroller = null;
  cicloDatos();
  cargarClubesUruguayos().then(() => cicloPlanteles());
  cicloFormaciones();
  setInterval(refrescarAviso, 2000);
  setTimeout(() => { scroller = new T.Scroller(document.getElementById("viewport"), proximoSegmento); }, T.demo ? 50 : 1500);
})();
</script>
</body>
