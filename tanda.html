<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tanda 13a0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500..900&family=Bitter:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* Pantalla de tanda 13a0 — pensada para 1920 x 1080 (se escala sola).
     La unidad --t vale 1 px en 1920 x 1080. */
  :root {
    --negro: #000; --blanco: #fff; --azul: #180B5B; --celeste: #0086C3;
    --amarillo: #F9BE02; --rojo: #C5021E; --gris: #6E6A86;
    --t: 1px; --g: calc(16 * var(--t));
    --grotesca: "Archivo", "Inter", "Helvetica Neue", Arial, sans-serif;
    --slab: "Bitter", "Rockwell", "DejaVu Serif", Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--negro); font-family: var(--grotesca); color: var(--azul); -webkit-font-smoothing: antialiased; }

  /* Contenido: queda en el hueco central del marco */
  .pantalla {
    position: absolute; left: calc(162 * var(--t)); top: calc(118 * var(--t)); width: calc(1596 * var(--t)); height: calc(844 * var(--t));
    display: grid; grid-template-columns: 1fr calc(480 * var(--t)); gap: var(--g);
  }
  /* Marco Torres García: bloques de color separados por la misma línea negra que el resto */
  .marco {
    position: absolute; left: 0; top: 0; width: calc(1920 * var(--t)); height: calc(1080 * var(--t));
    display: grid; gap: var(--g); padding: var(--g);
    grid-template-columns: calc(130 * var(--t)) calc(300 * var(--t)) 1fr calc(420 * var(--t)) 1fr calc(260 * var(--t)) calc(130 * var(--t));
    grid-template-rows: calc(86 * var(--t)) calc(240 * var(--t)) 1fr calc(300 * var(--t)) calc(86 * var(--t));
  }
  .marco > i { display: block; }
  .m-ro { background: var(--rojo); } .m-am { background: var(--amarillo); } .m-ce { background: var(--celeste); }
  .m-az { background: var(--azul); } .m-bl { background: var(--blanco); }
  .zona { position: relative; min-height: 0; overflow: hidden; }

  /* ---------- Noticia: titular arriba, foto de anclaje + dos párrafos ---------- */
  .noticia { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr; gap: var(--g); }
  .titular {
    background: var(--blanco); padding: calc(24 * var(--t)) calc(34 * var(--t));
    font-weight: 900; font-size: calc(44 * var(--t)); line-height: 1.06; letter-spacing: -0.025em;
    border-left: calc(20 * var(--t)) solid var(--rojo);
  }
  .titular b, .texto b { color: var(--rojo); }
  .cuerpo { display: grid; grid-template-columns: calc(360 * var(--t)) 1fr calc(120 * var(--t)); gap: var(--g); min-height: 0; }
  .cuerpo::after { content: ""; background: linear-gradient(var(--amarillo) 0 38%, var(--negro) 38% calc(38% + var(--g)), var(--blanco) calc(38% + var(--g)) 62%, var(--negro) 62% calc(62% + var(--g)), var(--celeste) calc(62% + var(--g))); }
  .foto { background: var(--azul) center/cover no-repeat; min-height: 0; position: relative; overflow: hidden; }
  .foto::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: calc(22 * var(--t)); background: var(--amarillo); }
  .credito {
    position: absolute; left: 0; bottom: calc(22 * var(--t)); padding: calc(6 * var(--t)) calc(12 * var(--t));
    background: rgba(0,0,0,.72); color: var(--blanco); font-size: calc(17 * var(--t)); font-weight: 600; letter-spacing: 0.02em;
  }
  .texto {
    background: var(--blanco); padding: calc(32 * var(--t)) calc(44 * var(--t)); min-height: 0; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; gap: calc(22 * var(--t));
    font-weight: 500; font-size: calc(25 * var(--t)); line-height: 1.4;
  }
  .texto p:first-child { font-weight: 700; }
  .noticia.sin-foto .cuerpo { grid-template-columns: 1fr calc(120 * var(--t)); }
  .noticia.sin-foto .foto { display: none; }
  .noticia.sin-foto .texto { font-size: calc(36 * var(--t)); }

  /* Transición en bloques: el titular entra desde la izquierda, la foto desde abajo y el texto desde la derecha */
  .noticia .titular, .noticia .foto, .noticia .texto { transition: transform .7s cubic-bezier(.75,0,.2,1); }
  .noticia.entrando .titular { transform: translateX(-110%); }
  .noticia.entrando .foto    { transform: translateY(110%); }
  .noticia.entrando .texto   { transform: translateX(110%); }
  .noticia .foto { transition-delay: .12s; }
  .noticia .texto { transition-delay: .22s; }
  .noticia.saliendo { opacity: 0; transition: opacity .35s; }

  /* ---------- Placas entre noticias: logo animado, WhatsApp y redes (se intercalan) ---------- */
  .placa { position: absolute; inset: 0; display: grid; gap: var(--g); overflow: hidden; }
  .placa > * { transition: transform .7s cubic-bezier(.75,0,.2,1); }
  .placa.entrando > :nth-child(odd)  { transform: translateX(-110%); }
  .placa.entrando > :nth-child(even) { transform: translateX(110%); }
  .placa > :nth-child(2) { transition-delay: .12s; } .placa > :nth-child(3) { transition-delay: .22s; }
  .placa.saliendo { opacity: 0; transition: opacity .35s; }
  /* logo: el logo grande y bloques de color que lo barren */
  .pl-logo { grid-template-rows: 1fr calc(120 * var(--t)); }
  .pl-logo .marca { position: relative; background: var(--blanco); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .pl-logo .marca img { width: 62%; height: auto; }
  .pl-logo .marca i { position: absolute; left: 0; width: 100%; height: 34%; transform: translateX(-102%); }
  .pl-logo .marca i:nth-of-type(1) { top: 0; background: var(--rojo); }
  .pl-logo .marca i:nth-of-type(2) { top: 33%; background: var(--amarillo); }
  .pl-logo .marca i:nth-of-type(3) { top: 66%; background: var(--celeste); }
  .pl-logo.anim .marca i { animation: barrer 1.6s cubic-bezier(.75,0,.2,1) .5s both; }
  .pl-logo.anim .marca i:nth-of-type(2) { animation-delay: .6s; } .pl-logo.anim .marca i:nth-of-type(3) { animation-delay: .7s; }
  .pl-logo .franja { display: grid; grid-template-columns: 2fr 1fr 3fr 1fr; gap: var(--g); }
  @keyframes barrer { 0% { transform: translateX(-102%); } 42%,58% { transform: translateX(0); } 100% { transform: translateX(102%); } }
  /* WhatsApp y redes */
  .pl-cont { grid-template-rows: calc(110 * var(--t)) 1fr; }
  .pl-cont .et { display: flex; align-items: center; padding: 0 calc(40 * var(--t)); font-family: var(--slab); font-weight: 800; font-size: calc(46 * var(--t)); letter-spacing: .04em; text-transform: uppercase; color: var(--blanco); }
  .pl-cont .cuerpo2 { background: var(--azul); color: var(--blanco); display: flex; flex-direction: column; justify-content: center; gap: calc(36 * var(--t)); padding: 0 calc(64 * var(--t)); }
  .pl-cont .linea { display: flex; align-items: center; gap: calc(22 * var(--t)); }
  .pl-cont .icos { display: flex; gap: calc(14 * var(--t)); }
  .pl-cont .ico { flex: none; display: inline-flex; align-items: center; justify-content: center; width: calc(150 * var(--t)); height: calc(150 * var(--t)); color: var(--blanco); }
  .pl-cont .ico svg { width: 66%; height: 66%; }
  .pl-cont .ico.ce { background: var(--celeste); } .pl-cont .ico.ro { background: var(--rojo); } .pl-cont .ico.am { background: var(--amarillo); color: var(--azul); } .pl-cont .ico.ne { background: var(--negro); }
  .pl-cont .grande { font-weight: 900; font-size: calc(130 * var(--t)); line-height: 1; letter-spacing: -.03em; white-space: nowrap; }
  .pl-cont .medio { font-weight: 900; font-size: calc(92 * var(--t)); line-height: 1; letter-spacing: -.025em; white-space: nowrap; }
  .pl-cont .chico { width: calc(96 * var(--t)); height: calc(96 * var(--t)); }
  .pl-cont .bajada { font-weight: 600; font-size: calc(34 * var(--t)); color: var(--amarillo); }

  /* ---------- Columna derecha ---------- */
  .lateral { display: grid; grid-template-rows: auto 1fr; gap: var(--g); min-height: 0; }
  .logo { background: linear-gradient(90deg, var(--blanco) 0 calc(100% - 110 * var(--t) - var(--g)), var(--negro) 0 calc(100% - 110 * var(--t)), var(--rojo) 0);
          display: flex; align-items: center; justify-content: center; padding: calc(16 * var(--t)) calc(110 * var(--t) + var(--g) + 16 * var(--t)) calc(16 * var(--t)) calc(16 * var(--t)); }
  .logo img { width: 100%; height: auto; max-height: calc(78 * var(--t)); width: auto; max-width: 100%; object-fit: contain; }

  /* ---------- Resultado destacado ---------- */
  .destacado { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr auto 1fr; gap: var(--g);
               transition: transform .75s cubic-bezier(.75,0,.2,1); }
  .destacado.arriba { transform: translateY(-110%); transition: none; }
  .destacado.abajo { transform: translateY(110%); }
  .d-comp {
    background: var(--rojo); color: var(--blanco); padding: calc(16 * var(--t)) calc(24 * var(--t));
    font-family: var(--slab); font-weight: 800; font-size: calc(26 * var(--t)); line-height: 1.1;
    display: flex; align-items: center; gap: calc(16 * var(--t));
  }
  .d-comp img { flex: none; height: calc(38 * var(--t)); width: calc(38 * var(--t)); object-fit: contain; background: var(--blanco); padding: calc(4 * var(--t)); }
  .d-eq { background: var(--blanco); display: flex; align-items: center; gap: calc(20 * var(--t)); padding: 0 calc(26 * var(--t)); min-height: 0; overflow: hidden; }
  .d-eq > img { flex: none; height: calc(68 * var(--t)); width: calc(68 * var(--t)); object-fit: contain; }
  .d-eq .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: calc(8 * var(--t)); }
  .d-eq .nom { font-weight: 900; font-size: calc(34 * var(--t)); line-height: 1; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d-eq.perdio .nom { color: var(--gris); }
  .d-eq .gol { font-size: calc(18 * var(--t)); font-weight: 500; line-height: 1.25;
               display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .d-eq .gol b { font-weight: 800; }
  .d-eq .uru { align-self: flex-start; display: inline-flex; align-items: center; gap: calc(10 * var(--t));
               padding: calc(5 * var(--t)) calc(12 * var(--t)); background: var(--celeste); color: var(--blanco);
               font-size: calc(20 * var(--t)); font-weight: 700; line-height: 1.2; }
  .d-eq .uru.con-gol { background: var(--amarillo); color: var(--azul); font-weight: 900; animation: destello .5s steps(2, jump-none) 8; }
  .d-eq .uru img { height: calc(16 * var(--t)); width: calc(24 * var(--t)); object-fit: cover; }
  .d-eq .num { flex: none; font-weight: 900; font-size: calc(84 * var(--t)); line-height: 1; font-variant-numeric: tabular-nums; }
  .d-estado {
    background: var(--azul); color: var(--blanco); display: flex; align-items: center; justify-content: center; gap: calc(14 * var(--t));
    padding: calc(10 * var(--t)); font-weight: 800; font-size: calc(23 * var(--t)); letter-spacing: 0.1em; text-transform: uppercase;
  }
  .d-estado.vivo { background: var(--rojo); }
  .d-estado.vivo::before { content: ""; width: calc(14 * var(--t)); height: calc(14 * var(--t)); background: var(--blanco); animation: latido 1.1s steps(2, jump-none) infinite; }
  .d-estado.pre { background: var(--celeste); }
  .d-vacio { position: absolute; inset: 0; background: var(--blanco); display: flex; align-items: center; justify-content: center; text-align: center;
             font-family: var(--slab); font-weight: 800; font-size: calc(38 * var(--t)); padding: calc(40 * var(--t)); }
  @keyframes latido { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes destello { 0% { background: var(--amarillo); } 100% { background: var(--blanco); } }

  /* ---------- Ticker: no se ve, pero corre por detrás porque le pasa los resultados al destacado ---------- */
  .ticker { position: absolute; left: 0; top: 0; width: 1px; height: 1px; border: 0; opacity: 0; pointer-events: none; }
  /* (si en config.js se pone tanda.mostrarTicker: true, vuelve a verse abajo) */
  body.con-ticker .pantalla { left: 0; top: 0; width: calc(1920 * var(--t)); height: calc(980 * var(--t)); padding: var(--g) var(--g) 0; }
  body.con-ticker .marco { display: none; }
  body.con-ticker .ticker { top: calc(980 * var(--t)); width: calc(1920 * var(--t)); height: calc(100 * var(--t)); opacity: 1; }
</style>
</head>

<script>
(function () {
  const T = window.Ticker, C = T.config, TC = C.tanda || {};
  const BANDERA_URU = "escudos/bandera-uruguay.png";   // propia (respaldo: la de ESPN)
  if (T.respaldo) T.respaldo[BANDERA_URU] = "https://a.espncdn.com/i/teamlogos/countries/500/uru.png";

  // Escala: todo está pensado para 1920 x 1080
  function medir() { document.documentElement.style.setProperty("--t", Math.min(innerWidth / 1920, innerHeight / 1080) + "px"); }
  medir(); addEventListener("resize", medir);

  // El ticker de siempre, sin logo (el logo grande está arriba a la derecha)
  if (TC.mostrarTicker) document.body.classList.add("con-ticker");
  document.getElementById("ticker").src = "ticker.html?sinlogo&v=20261028" + (T.demo ? "&demo" : "");

  const escapar = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const formatear = (s) => escapar(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<b>$1</b>");

  // Achica la letra de un bloque hasta que el texto entre (como mínimo, al 65 %)
  function encajar(el) {
    el.style.fontSize = "";
    let tam = parseFloat(getComputedStyle(el).fontSize);
    const min = tam * 0.65;
    while (el.scrollHeight > el.clientHeight + 1 && tam > min) { tam -= 1; el.style.fontSize = tam + "px"; }
  }

  /* ==============================================================
     NOTICIAS (planilla de Google: mostrar, titular, parrafo_1,
     parrafo_2, imagen, credito_foto)
     ============================================================== */
  const zonaN = document.getElementById("zona-noticia");
  let noticias = [], iN = -1, actualN = null;
  const sinPlanilla = !(C.googleSheet || "").trim();

  async function cargarNoticias() {
    for (;;) {
      if (T.demo || sinPlanilla) noticias = window.TickerDemo.noticiasTanda.slice();
      else {
        try { await T.cargarAjustes(); } catch (e) { /* sin pestaña de ajustes */ }
        try {
          const filas = await T.leerHoja(C.hojaNoticias || "noticias");
          if (filas) noticias = filas.filter((f) => T.esSi(f.mostrar) && (f.titular || "").trim()).map((f) => {
            let parrafos = [f.parrafo_1, f.parrafo_2].filter((x) => (x || "").trim());
            if (!parrafos.length && f.texto) parrafos = f.texto.split(/\n\s*\n/).filter((x) => x.trim()).slice(0, 2);
            return { tit: f.titular, parrafos, img: T.urlImagen(f.imagen), credito: f.credito_foto || f.credito || "" };
          });
        } catch (e) { console.warn("No se pudo leer la planilla", e.message); }
      }
      await T.esperar((C.actualizarCadaSegundos || 60) * 1000);
    }
  }

  function crearNoticia(n) {
    const d = T.el("div", "noticia entrando" + (n.img ? "" : " sin-foto"));
    const tit = T.el("div", "titular"); tit.innerHTML = formatear(n.tit); d.appendChild(tit);
    const cuerpo = T.el("div", "cuerpo");
    const foto = T.el("div", "foto");
    if (n.img) {
      foto.style.backgroundImage = "url('" + n.img.replace(/'/g, "%27") + "')";
      if (n.credito) foto.appendChild(T.el("div", "credito", /^foto/i.test(n.credito) ? n.credito : "Foto: " + n.credito));
    }
    cuerpo.appendChild(foto);
    const texto = T.el("div", "texto");
    (n.parrafos || []).forEach((p) => { const el = T.el("p"); el.innerHTML = formatear(p); texto.appendChild(el); });
    if (!(n.parrafos || []).length) texto.style.display = "none";
    cuerpo.appendChild(texto);
    d.appendChild(cuerpo);
    return d;
  }

  function siguienteNoticia() {
    if (!noticias.length) return;
    iN = (iN + 1) % noticias.length;
    const nueva = crearNoticia(noticias[iN]);
    zonaN.appendChild(nueva);
    // si el titular o los párrafos no entran, se achica la letra
    const tit = nueva.querySelector(".titular");
    tit.style.maxHeight = (300 * parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--t"))) + "px";
    tit.style.overflow = "hidden";
    encajar(tit); encajar(nueva.querySelector(".texto"));
    void nueva.offsetWidth;
    nueva.classList.remove("entrando");
    if (actualN) { const v = actualN; v.classList.add("saliendo"); setTimeout(() => v.remove(), 500); }
    actualN = nueva;
  }
  /* Placas entre noticias, en este orden y en ciclo: logo · WhatsApp · logo · redes
     (NOTI 1 - logo - NOTI 2 - WhatsApp - NOTI 3 - logo - NOTI 4 - redes - NOTI 5 …).
     Datos de contacto: config.js → redes (si no está, van estos). */
  const RED = Object.assign({ whatsapp: "092 995 111", usuario: "@treceacero", facebook: "13a0" }, C.redes || (C.camaras || {}).redes || {});
  const ORDEN_PLACAS = TC.placas || ["logo", "whatsapp", "logo", "redes"];
  let iP = -1;
  const ico = (id, color, extra) => `<i class="ico ${color}${extra ? " " + extra : ""}"><svg><use href="#${id}"/></svg></i>`;
  function crearPlaca(tipo) {
    const d = T.el("div", "placa entrando");
    if (tipo === "whatsapp") {
      d.classList.add("pl-cont");
      d.innerHTML = `<div class="et" style="background:var(--celeste)">Escribinos</div>` +
        `<div class="cuerpo2"><div class="linea">${ico("i-wa", "ce")}<div><div class="bajada">Mandanos tu mensaje por WhatsApp</div><div class="grande">${escapar(RED.whatsapp)}</div></div></div></div>`;
    } else if (tipo === "redes") {
      d.classList.add("pl-cont");
      d.innerHTML = `<div class="et" style="background:var(--rojo)">Seguinos en las redes</div>` +
        `<div class="cuerpo2"><div class="linea"><div class="icos">${ico("i-ig", "ro")}${ico("i-x", "ne")}${ico("i-tt", "am")}</div></div>` +
        `<div class="grande">${escapar(RED.usuario)}</div>` +
        `<div class="linea">${ico("i-fb", "ce", "chico")}<div class="medio">${escapar(RED.facebook)}</div></div></div>`;
    } else {
      d.classList.add("pl-logo");
      d.innerHTML = `<div class="marca"><img src="logo.png" alt="13a0"><i></i><i></i><i></i></div>` +
        `<div class="franja"><i class="m-ro"></i><i class="m-am"></i><i class="m-ce"></i><i class="m-az"></i></div>`;
    }
    return d;
  }
  function mostrarPlaca() {
    iP = (iP + 1) % ORDEN_PLACAS.length;
    const nueva = crearPlaca(ORDEN_PLACAS[iP]);
    zonaN.appendChild(nueva);
    void nueva.offsetWidth;
    nueva.classList.remove("entrando");
    if (nueva.classList.contains("pl-logo")) nueva.classList.add("anim");
    if (actualN) { const v = actualN; v.classList.add("saliendo"); setTimeout(() => v.remove(), 500); }
    actualN = nueva;
  }

  let tocaPlaca = false;
  function rotarNoticias() {
    // mientras no haya noticias, se reintenta enseguida (sin placas)
    if (!noticias.length) { siguienteNoticia(); setTimeout(rotarNoticias, 1000); return; }
    if (tocaPlaca && TC.placas !== false) {
      mostrarPlaca();
      tocaPlaca = false;
      setTimeout(rotarNoticias, (TC.segundosPorPlaca || 7) * 1000);
      return;
    }
    siguienteNoticia();
    tocaPlaca = true;
    setTimeout(rotarNoticias, (TC.segundosPorNoticia || 14) * 1000);
  }

  /* ==============================================================
     RESULTADO DESTACADO (los datos llegan del ticker de abajo)
     Prioridad: en vivo → fútbol uruguayo → goles/partidos de uruguayos
     ============================================================== */
  const zonaR = document.getElementById("zona-resultado");
  let resultados = [], actualR = null, tarjetaR = null, recibido = false;

  window.addEventListener("message", (ev) => {
    const d = ev.data || {};
    if (d.tipo !== "ticker-resultados") return;
    recibido = true;
    const RANGO = { in: 0, post: 1, pre: 2 };
    resultados = (d.items || []).slice()
      .sort((a, b) => b.prioridad - a.prioridad || (RANGO[a.estado] ?? 1) - (RANGO[b.estado] ?? 1))
      .slice(0, TC.maxDestacados || 10);
    // si el partido que está en pantalla cambió (gol, minuto), se actualiza sin animar
    if (actualR && tarjetaR) {
      const it = resultados.find((x) => x.k === actualR.k) || (d.items || []).find((x) => x.k === actualR.k);
      if (it) { llenarDestacado(tarjetaR, it, actualR); actualR = it; }
    }
    if (!actualR || actualR.k === "vacio") siguienteResultado();
  });

  function bloqueEquipo(it, e, otro) {
    const perdio = it.estado === "post" && !e.gano && otro.gano;
    const d = T.el("div", "d-eq" + (perdio ? " perdio" : ""));
    if (e.logo) d.appendChild(T.img(e.logo));
    const txt = T.el("div", "txt");
    txt.appendChild(T.el("div", "nom", e.nombre));
    if (e.goleadores && e.goleadores.length) {
      const g = T.el("div", "gol");
      e.goleadores.forEach((x, i) => {
        if (i) g.appendChild(document.createTextNode(" · "));
        g.appendChild(T.el("b", null, x.jugador + (x.ec ? " (e/c)" : "")));
        g.appendChild(document.createTextNode(" " + x.mins.join(" ")));
      });
      txt.appendChild(g);
    }
    const uruTxt = (e.uruGoles || []).length ? "Gol uruguayo · " + e.uruGoles.join(" · ") : (e.uruJugaron || []).slice(0, 2).join(" · ");
    if (uruTxt) {
      const u = T.el("div", "uru" + ((e.uruGoles || []).length ? " con-gol" : ""));
      u.appendChild(T.img(BANDERA_URU));
      u.appendChild(document.createTextNode(uruTxt));
      txt.appendChild(u);
    }
    d.appendChild(txt);
    if (it.estado !== "pre") d.appendChild(T.el("div", "num", e.goles || "0"));
    return d;
  }

  function llenarDestacado(t, it, anterior) {
    t.innerHTML = "";
    const c = T.el("div", "d-comp");
    if (it.logo) c.appendChild(T.img(it.logo));
    c.appendChild(T.el("span", null, it.comp));
    t.appendChild(c);
    t.appendChild(bloqueEquipo(it, it.local, it.visita));
    let est = it.etiqueta || "";
    if (it.estado === "in") est = /^\d|'/.test(est) ? "En vivo · " + est : est;
    if (it.estado === "pre") est = /^\d/.test(est) ? "Hoy · " + est : est;
    t.appendChild(T.el("div", "d-estado " + (it.estado === "in" ? "vivo" : it.estado), est));
    t.appendChild(bloqueEquipo(it, it.visita, it.local));
  }

  function entrarR(nueva) {
    nueva.classList.add("arriba");
    zonaR.appendChild(nueva);
    const vieja = tarjetaR;
    void nueva.offsetWidth;
    nueva.classList.remove("arriba");
    if (vieja) { vieja.classList.add("abajo"); setTimeout(() => vieja.remove(), 900); }
    tarjetaR = nueva;
  }

  function siguienteResultado() {
    if (!resultados.length) {
      if (!actualR || actualR.k !== "vacio") {
        const v = T.el("div", "destacado");
        v.appendChild(T.el("div", "d-vacio", recibido ? "Sin partidos en este momento" : "Cargando resultados…"));
        entrarR(v); actualR = { k: "vacio" };
      } else if (recibido) tarjetaR.querySelector(".d-vacio").textContent = "Sin partidos en este momento";
      return;
    }
    const i = actualR ? resultados.findIndex((x) => x.k === actualR.k) : -1;
    const it = resultados[(i + 1) % resultados.length];
    if (actualR && it.k === actualR.k && tarjetaR) { llenarDestacado(tarjetaR, it); return; }
    const t = T.el("div", "destacado");
    llenarDestacado(t, it);
    entrarR(t);
    actualR = it;
  }
  function rotarResultados() {
    siguienteResultado();
    const seg = (TC.segundosPorResultado || 8) * 1000;
    setTimeout(rotarResultados, actualR && actualR.estado === "in" ? seg * 1.5 : seg);
  }

  // ?previa: la usa el panel de control. Muestra solo la noticia que se está editando (sin placas)
  if (T.params.has("previa")) {
    window.addEventListener("message", (ev) => {
      const d = ev.data || {};
      if (!d.panel13a0 || !d.noticia) return;
      // se reemplaza en el lugar, sin animación (se actualiza con cada tecla)
      const nueva = crearNoticia(d.noticia);
      nueva.classList.remove("entrando");
      zonaN.querySelectorAll(".noticia").forEach((x) => x.remove());
      zonaN.appendChild(nueva);
      const tit = nueva.querySelector(".titular");
      tit.style.maxHeight = (300 * parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--t"))) + "px";
      tit.style.overflow = "hidden";
      encajar(tit); encajar(nueva.querySelector(".texto"));
      actualN = nueva;
    });
  } else {
    cargarNoticias();
    setTimeout(rotarNoticias, 800);
  }
  setTimeout(rotarResultados, 2500);
})();
</script>
</body>
</html>
