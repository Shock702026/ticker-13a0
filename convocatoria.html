<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convocatoria 13a0</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=Bitter:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* Respuesta a una convocatoria: la abre el botón del mail (Acepto / No puedo) */
  :root { --azul:#180B5B; --celeste:#0086C3; --amarillo:#F9BE02; --rojo:#C5021E; --gris:#6E6A86; --fondo:#F3F2F7; --linea:#E3E1EC; --verde:#1a8a46; --f:"Archivo","Helvetica Neue",Arial,sans-serif; --slab:"Bitter",Georgia,serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font:16px/1.5 var(--f); color:var(--azul); background:var(--fondo); min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; }
  .card { background:#fff; outline:1px solid var(--linea); padding:24px; width:min(480px, 100%); display:flex; flex-direction:column; gap:14px; }
  .marca { display:flex; align-items:center; gap:10px; } .marca b { background:var(--azul); color:#fff; font:900 24px/1 var(--f); padding:7px 9px; } .marca b i { font-style:normal; color:var(--celeste); } .marca span { font:800 14px var(--slab); letter-spacing:.08em; text-transform:uppercase; }
  h1 { font:800 24px/1.15 var(--slab); } h2 { font:800 18px/1.2 var(--f); }
  .datos { display:flex; flex-direction:column; gap:2px; font-weight:600; } .datos b { font-weight:800; }
  .res { padding:12px 14px; font-weight:800; } .res.acepta { background:#e2f4e9; color:var(--verde); } .res.rechaza { background:#fbe3e6; color:var(--rojo); } .res.pendiente { background:var(--fondo); }
  .botones { display:flex; gap:10px; flex-wrap:wrap; } button { font:800 16px var(--f); border:0; padding:13px 18px; color:#fff; cursor:pointer; } .si { background:var(--verde); } .no { background:var(--rojo); }
  input { font:600 16px var(--f); border:2px solid var(--linea); padding:10px 12px; width:100%; color:var(--azul); }
  small { color:var(--gris); font-weight:600; }
</style></head><body>
<div class="card" id="c"><div class="marca"><b>13<i>a</i>0</b><span>Convocatoria</span></div><p>Cargando…</p></div>
<script>
if (location.hostname === "shock702026.github.io") location.replace("https://treceacero.github.io/panel/convocatoria.html" + location.search);
const API = "https://script.google.com/macros/s/AKfycbyYvADH1I3AtOgpOA2DopV3xPxCa-YFS2LukxOnsqSZqM_skwAnXFjQPQ4WRojcBcJh/exec";
const Q = new URLSearchParams(location.search), TOKEN = Q.get("c");
const C = document.getElementById("c"), marca = C.firstElementChild.outerHTML;
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fechaTxt = (f) => { const [y, m, d] = f.split("-"); return ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"][new Date(+y, m - 1, +d).getDay()] + " " + (+d) + "/" + m; };
const pedir = (r, motivo) => fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn: "responderToken", token: TOKEN, r, motivo }) }).then((x) => x.json()).then((x) => { if ("error" in x) throw new Error(x.error); return x.ok; });
function pintar(d, recien) {
  if (d.estado === "nada") { C.innerHTML = marca + "<h1>No encontré esta convocatoria.</h1><small>Revisá que el link del mail esté completo.</small>"; return; }
  if (d.estado === "cancelada") { C.innerHTML = marca + `<h1>Esta convocatoria se canceló.</h1><p>${esc(d.partido)}</p>`; return; }
  const TXT = { acepta: "✓ Confirmaste que vas.", rechaza: "✗ Avisamos que no podés.", pendiente: "Todavía no respondiste." };
  C.innerHTML = marca + `<div class="res ${d.respuesta}">${recien ? "¡Listo! " : ""}${TXT[d.respuesta]}</div><h1>${esc(d.partido)}</h1>
    <div class="datos"><span><b>${esc(fechaTxt(d.fecha))}</b>${d.competencia ? " · " + esc(d.competencia) : ""}</span><span>Tu rol: <b>${esc(d.rol)}</b></span>
    <span>Lugar: <b>${esc(d.locacion || "a confirmar")}</b></span><span>Previa: <b>${esc(d.previa || "—")}</b> · Partido: <b>${esc(d.hora || "—")}</b></span>${d.notas ? `<span>${esc(d.notas)}</span>` : ""}</div>
    <div class="botones"></div><small>También podés responder desde el Panel 13a0, en Convocatorias.</small>`;
  const B = C.querySelector(".botones");
  if (d.respuesta !== "acepta") { const b = document.createElement("button"); b.className = "si"; b.textContent = d.respuesta === "rechaza" ? "Me equivoqué: sí puedo" : "✓ Acepto"; b.onclick = () => responder("si"); B.appendChild(b); }
  if (d.respuesta !== "rechaza") {
    const b = document.createElement("button"); b.className = "no"; b.textContent = d.respuesta === "acepta" ? "Me equivoqué: no puedo" : "✗ No puedo";
    b.onclick = () => { if (!B.querySelector("input")) { const i = document.createElement("input"); i.placeholder = "¿Por qué no podés? (opcional)"; B.prepend(i); i.focus(); b.textContent = "Mandar «no puedo»"; return; } responder("no", B.querySelector("input").value); };
    B.appendChild(b);
  }
}
async function responder(r, motivo) { C.querySelectorAll("button").forEach((b) => (b.disabled = true)); try { pintar(await pedir(r, motivo), true); } catch (e) { alertar(e); } }
function alertar(e) { C.innerHTML = marca + `<h1>No se pudo conectar.</h1><small>${esc(e.message || e)}</small>`; }
// el botón del mail ya trae la respuesta: el «sí» se registra directo; el «no» pide el motivo primero
(async () => {
  if (!TOKEN) { pintar({ estado: "nada" }); return; }
  try { const r = Q.get("r"); if (r === "si") pintar(await pedir("si"), true); else { const d = await pedir(""); pintar(d); if (r === "no" && d.respuesta !== "rechaza") { const b = C.querySelector(".no"); if (b) b.click(); } } }
  catch (e) { alertar(e); }
})();
</script>
</body></html>
