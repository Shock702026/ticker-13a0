      else if (v === "ocultar") fila = ["Ocultar partido", loc, vis, ""];
      else if (v === "nombre") fila = ["Cambiar nombre", eq, "", inputs.nuevo.value.trim()];
      else if (v === "agregar") fila = ["Agregar uruguayos", eq, "", inputs.jug.value.trim()];
      else if (v === "lesion") fila = [inputs.tipoAus.value, eq, "", inputs.jug.value.trim()];
      else if (v === "sano") fila = ["No lesionado", eq, "", inputs.jug.value.trim()];
      else fila = ["Quitar uruguayos", eq, "", inputs.jug.value.trim()];
      const nota = v === "lesion" && inputs.motivo.value.trim() ? inputs.motivo.value.trim() + " · " : "";
      salida.value = fila.concat([nota + "desde la página de revisión " + fmtHora.format(new Date())]).join("\t");
      const falta = (v === "nombre" && !fila[3]) || ((v === "agregar" || v === "lesion" || v === "sano") && !fila[3]);
      copiar.disabled = falta;
      aviso.textContent = falta ? "Completá el dato de arriba." : "Copiá la fila y pegala en la primera fila vacía de la pestaña correcciones (columna A). El cambio se ve en alrededor de un minuto.";
    }
    copiar.onclick = async () => {
      try { await navigator.clipboard.writeText(salida.value); copiar.textContent = "¡Copiada!"; }
      catch (e) { salida.focus(); salida.select(); copiar.textContent = "Seleccionada: Cmd+C para copiar"; }
      setTimeout(() => (copiar.textContent = "Copiar la fila"), 2500);
    };
    sel.onchange = dibujarCampos;
    caja.appendChild(salida); caja.appendChild(aviso);
    const botones = T.el("div", "v-botones");
    botones.appendChild(copiar); if (LINK_CORRECCIONES) botones.appendChild(ir);
    const cerrar = T.el("button", "v-cerrar", "Cerrar"); cerrar.onclick = () => fondo.remove();
    botones.appendChild(cerrar);
    caja.appendChild(botones);
    document.body.appendChild(fondo);
    dibujarCampos();
  }

  function iniciarVista() {
    document.documentElement.classList.add("vista");
    const cab = T.el("header", "v-cab");
    cab.appendChild(T.el("h1", null, "Ticker 13a0 · lo que pasa por la cinta"));
    const dias = T.el("nav", "v-dias");
    const hoy = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(fmtDiaSemana.format(new Date()));
    const p = (T.params.get("dia") || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    if (DIAS.includes(p)) diaElegido = DIAS.indexOf(p);
    [1, 2, 3, 4, 5, 6, 0].forEach((i) => {
      const b = T.el("button", null, DIAS[i].replace("miercoles", "miércoles").replace("sabado", "sábado") + (i === hoy ? " (hoy)" : ""));
      b.onclick = () => { diaElegido = i; dibujar(); };
      b.dataset.i = i;
      dias.appendChild(b);
    });
    cab.appendChild(dias);
    const estado = T.el("p", "v-estado");
    cab.appendChild(estado);
    const cont = T.el("main", "v-cont");
    document.body.appendChild(cab);
    document.body.appendChild(cont);
    function dibujar() {
      const d = diaElegido != null ? diaElegido : hoy;
      dias.querySelectorAll("button").forEach((b) => b.classList.toggle("activo", +b.dataset.i === d));
      cont.innerHTML = "";
      diaPrograma().forEach((k, n) => {
        const sec = T.el("section", "v-bloque");
        sec.appendChild(T.el("h2", null, (n + 1) + ". " + (NOMBRE_BLOQUE[k] || k)));
        let piezas = [];
        try { piezas = (BLOQUES[k] || (() => []))(); } catch (e) { piezas = []; }
        if (!piezas.length) sec.appendChild(T.el("p", "v-vacio", (vueltaCompleta || (principalesCargados && /^(uru|segunda|planilla)/.test(k))) ? "Sin datos ahora: este bloque se saltea en la cinta." : "Cargando…"));
        else {
          const seg = T.el("div", "seg v-seg");
          piezas.forEach((x) => {
            const el = piezaDOM(x);
            // botón para armar una corrección de este partido o de esta fila de tabla
            if (x.tipo === "partido" || x.tipo === "fila") {
              el.classList.add("v-editable");
              const b = T.el("button", "v-corregir", "Corregir");
              b.onclick = (ev) => { ev.stopPropagation(); abrirCorreccion(x); };
              el.appendChild(b);
            }
            seg.appendChild(el);
          });
          sec.appendChild(seg);
        }
        cont.appendChild(sec);
      });
      estado.textContent = (T.noReconocidos.length ? "⚠ En la pestaña programa no reconozco: " + T.noReconocidos.join(", ") + " · " : "") +
        "Actualizado " + fmtHora.format(new Date()) + " · se actualiza solo cada minuto" +
        (d !== hoy ? " · los resultados son los de hoy, ordenados como el día elegido" : "");
    }
    dibujar();
    // al principio se redibuja seguido, a medida que llegan los datos; después, cada minuto
    let veces = 0;
    const rapido = setInterval(() => { dibujar(); if (++veces >= 24) clearInterval(rapido); }, 5e3);
    setInterval(dibujar, 60e3);
  }

  // ajustes y programa editables desde la planilla: se leen cada minuto, aparte de los resultados
  async function cicloAjustes() {
    for (;;) {
      try {
        await T.cargarAjustes();
        await cargarProgramaHoja();
        await T.cargarEscudosHoja();
        await T.cargarCorrecciones();
        await T.cargarLesionados();
        if (scroller && !T.params.get("velocidad") && C.velocidad) scroller.vel = C.velocidad;
      } catch (e) { console.warn("Ajustes de la planilla", e.message); }
      await T.esperar(60e3);
    }
  }

  let scroller = null;
  cicloAjustes();
  cicloDatos();
  cargarClubesUruguayos().then(() => cicloPlanteles());
  cicloFormaciones();
  if (T.params.has("vista")) iniciarVista();
  else {
    setInterval(refrescarAviso, 2000);
    setTimeout(() => { scroller = new T.Scroller(document.getElementById("viewport"), proximoSegmento); }, T.demo ? 50 : 1500);
  }
})();
</script>
</body>
</html>
